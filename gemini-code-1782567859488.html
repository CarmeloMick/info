<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>HK Info Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 10px;
        }

        /* 頂部時間區 (紅底) */
        .section-time {
            background-color: #b30000;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 10px;
        }
        .date { font-size: 1.5rem; font-weight: bold; color: #ffcccc; letter-spacing: 2px; }
        .time { font-size: 3.5rem; font-weight: bold; font-family: monospace; margin: 5px 0; }
        .custom-text { font-size: 1rem; color: #ff9999; }

        /* 中部巴士區 (黑底帶線) */
        .section-bus {
            flex: 1;
            background-color: #111;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .bus-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #222;
        }
        .bus-row:last-child { border-bottom: none; }
        .bus-info { display: flex; align-items: center; }
        .bus-no {
            background-color: #ffcc00;
            color: #000;
            font-weight: bold;
            font-size: 1.6rem;
            padding: 4px 12px;
            border-radius: 6px;
            margin-right: 15px;
            min-width: 80px;
            text-align: center;
        }
        .bus-dest { font-size: 1.2rem; color: #ccc; }
        .bus-eta { font-size: 1.8rem; font-weight: bold; color: #00ffcc; font-family: monospace; }

        /* 底部天氣區 (藍底) */
        .section-weather {
            background-color: #0044cc;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .weather-left { display: flex; flex-direction: column; }
        .temp { font-size: 3.5rem; font-weight: bold; line-height: 1; }
        .weather-meta { font-size: 1.1rem; color: #b3d1ff; margin-top: 5px; }
        .weather-right { text-align: right; }
        .warning-box {
            background-color: #ff3333;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 5px;
            display: inline-block;
        }
        .weather-text { font-size: 1.2rem; font-weight: bold; color: #fff; }
    </style>
</head>
<body>

    <div class="section-time" id="pixel-shifter">
        <div class="date" id="date-str">2026/06/27 SAT</div>
        <div class="time" id="time-str">05:59 PM</div>
        <div class="custom-text">Testing mode • 運作中</div>
    </div>

    <div class="section-bus">
        <div class="bus-row">
            <div class="bus-info">
                <div class="bus-no">38</div>
                <div class="bus-dest">葵盛東 (葵芳)</div>
            </div>
            <div class="bus-eta" id="bus-38">讀取中...</div>
        </div>
        </div>

    <div class="section-weather">
        <div class="weather-left">
            <div class="temp" id="weather-temp">--°C</div>
            <div class="weather-meta" id="weather-humidity">濕度: --%</div>
            <div class="weather-meta" id="weather-uv">UV 指數: --</div>
        </div>
        <div class="weather-right">
            <div id="weather-warning"></div>
            <div class="weather-text" id="weather-desc">正在連線...</div>
        </div>
    </div>

    <script>
        // --- 核心配置 ---
        // 範例：九龍灣站 (Stop ID: 96D4686A34A62D71)
        const KMB_STOP_ID = "96D4686A34A62D71"; 

        // 1. 更新時間同日期
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const dayStr = days[now.getDay()];
            
            let hours = now.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // 0 點轉為 12 點
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('date-str').textContent = `${year}/${month}/${date} ${dayStr}`;
            document.getElementById('time-str').textContent = `${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;
        }

        // 2. 拿取香港天文台數據
        async function fetchWeather() {
            try {
                // 實時天氣
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                
                // 預設拎天文台總部溫度
                if(data.temperature && data.temperature.data.length > 0) {
                    document.getElementById('weather-temp').textContent = `${data.temperature.data[0].value}°C`;
                }
                if(data.humidity && data.humidity.data.length > 0) {
                    document.getElementById('weather-humidity').textContent = `濕度: ${data.humidity.data[0].value}%`;
                }
                if(data.uvindex && data.uvindex.data.length > 0) {
                    document.getElementById('weather-uv').textContent = `UV 指數: ${data.uvindex.data[0].value}`;
                } else {
                    document.getElementById('weather-uv').textContent = `UV 指數: 0`;
                }
                
                // 天氣警告摘要
                const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await warnRes.json();
                const warnBox = document.getElementById('weather-warning');
                warnBox.innerHTML = '';
                
                if (Object.keys(warnData).length > 0) {
                    for (let key in warnData) {
                        const warn = warnData[key];
                        warnBox.innerHTML += `<div class="warning-box">${warn.name}</div> `;
                    }
                    document.getElementById('weather-desc').textContent = "請注意警告";
                } else {
                    document.getElementById('weather-desc').textContent = "天氣大致良好";
                }

            } catch (error) {
                console.error("天氣獲取失敗", error);
            }
        }

        // 3. 拿取九巴 ETA 數據
        async function fetchBusETA() {
            try {
                // 叫九巴 API 拿取特定車站、特定路線的到站時間
                const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${KMB_STOP_ID}/38/1`);
                const json = await res.json();
                
                // 篩選出合適方向的班次 (例如：dir: "O" 或者是去葵盛東)
                const etas = json.data.filter(item => item.dir === "O" && item.eta);
                
                if(etas.length > 0) {
                    // 拿取最近兩班車
                    const nextBus1 = etas[0] ? calculateMinutes(etas[0].eta) : '--';
                    const nextBus2 = etas[1] ? calculateMinutes(etas[1].eta) : '--';
                    
                    document.getElementById('bus-38').textContent = `${nextBus1} 點 / ${nextBus2} 點`;
                } else {
                    document.getElementById('bus-38').textContent = "尾班車已過";
                }
            } catch (error) {
                document.getElementById('bus-38').textContent = "連線失敗";
            }
        }

        // 計算剩餘分鐘數
        function calculateMinutes(etaTimeStr) {
            if (!etaTimeStr) return '--';
            const eta = new Date(etaTimeStr);
            const now = new Date();
            const diffMs = eta - now;
            const diffMins = Math.ceil(diffMs / 1000 / 60);
            return diffMins <= 0 ? "即將到站" : `${diffMins} 鐘`;
        }

        // 4. 防燒印：微調像素位置
        function pixelShift() {
            const shifter = document.getElementById('pixel-shifter');
            const randomX = Math.floor(Math.random() * 3) - 1; // -1, 0, 1 px
            const randomY = Math.floor(Math.random() * 3) - 1;
            shifter.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        // --- 啟動與定時器 ---
        updateClock();
        fetchWeather();
        fetchBusETA();

        setInterval(updateClock, 1000);       // 每秒更新時間
        setInterval(fetchBusETA, 30000);     // 每 30 秒更新巴士
        setInterval(fetchWeather, 300000);   // 每 5 分鐘更新天氣
        setInterval(pixelShift, 600000);     // 每 10 分鐘微移防燒印

    </script>
</body>
</html>
