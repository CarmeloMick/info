<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Transit & Weather Dashboard</title>
  <style>
    /* 1. 全局高級深色主題重設 (完美對齊目標圖片色彩規格) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #0b0f19; /* 極致深藍黑底色 */
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 1.5vh 1.5vw;
    }

    /* 主網格排版容器 */
    .dashboard-container {
      display: flex;
      flex-direction: column;
      height: 97vh;
      gap: 1.5vh;
    }

    /* 工業級毛玻璃質感卡片基底 */
    .glass-card {
      background-color: #131c2e; /* 高級灰藍色面板色塊 */
      border: 1px solid #22314d;
      border-radius: 16px;
      padding: 2vh 2vw;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* 區塊 C：頂部大氣科學與時鐘面版 */
    .weather-card {
      display: flex;
      gap: 3vw;
      height: 22vh;
    }
    .weather-left {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid #22314d;
      padding-right: 2vw;
    }
    .date-time-string {
      font-size: 2vh;
      color: #94a3b8;
      margin-bottom: 0.5vh;
      font-variant-numeric: tabular-nums;
    }
    .location-title {
      font-size: 3vh;
      font-weight: bold;
      color: #38bdf8;
    }
    .temp-row {
      display: flex;
      align-items: center;
      gap: 1.5vw;
      margin-top: 0.5vh;
    }
    .big-temp {
      font-size: 6.8vh;
      font-weight: bold;
      line-height: 1;
      color: #ffffff;
    }
    .weather-sub-metrics {
      font-size: 1.9vh;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 0.3vh;
    }
    .weather-right-text {
      flex: 2;
      font-size: 1.9vh;
      color: #cbd5e1;
      line-height: 1.6;
      overflow-y: auto;
      padding-right: 0.5vw;
    }

    /* 區塊 D：特別交通消息組件 (完美還原截圖中央看板) */
    .traffic-news-card {
      height: 10vh;
      display: flex;
      align-items: center;
      gap: 1.5vw;
      background-color: #16223f;
      border: 1px solid #2e4374;
      padding: 0 2vw;
    }
    .traffic-icon {
      font-size: 3.5vh;
      animation: pulse-glow 2s infinite;
    }
    .traffic-content-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .traffic-title {
      font-size: 2vh;
      font-weight: bold;
      color: #f43f5e; /* 醒目警告紅 */
      margin-bottom: 0.2vh;
    }
    .traffic-text-container {
      font-size: 1.8vh;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 區塊 B：實時巴士看板分區 */
    .transit-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5vh;
      min-height: 0;
    }
    
    /* 高階導航 Pills Tabs */
    .tab-navigation {
      display: flex;
      gap: 1vw;
      border-bottom: 1px solid #22314d;
      padding-bottom: 1.2vh;
    }
    .tab-pill {
      background-color: #1e293b;
      color: #94a3b8;
      border: none;
      padding: 1vh 2vw;
      font-size: 2vh;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }
    .tab-pill.active {
      background-color: #2563eb; /* 經典科技藍 */
      color: #ffffff;
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
    }

    /* 巴士數據行格陣列 */
    .bus-grid-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.8vh;
      overflow-y: auto;
      min-height: 0;
    }
    .bus-data-row {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 1.5vh 2vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .bus-info-meta {
      display: flex;
      flex-direction: column;
    }
    .route-badge-number {
      font-size: 4.2vh;
      font-weight: 900;
      color: #eab308; /* 經典智慧金黃色 */
      line-height: 1;
    }
    .route-destination-text {
      font-size: 1.8vh;
      color: #64748b;
      margin-top: 0.5vh;
    }
    .arrival-slots-wrapper {
      display: flex;
      gap: 4vw;
    }
    .eta-slot-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      min-width: 10vw;
    }
    .eta-countdown-display {
      font-size: 3.6vh;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }
    .eta-countdown-display.incoming {
      color: #22c55e; /* 即將抵達綠 */
    }
    .eta-absolute-clock-time {
      font-size: 1.7vh;
      color: #64748b;
      margin-top: 0.2vh;
      font-variant-numeric: tabular-nums;
    }

    /* 直屏 (Portrait) 自動自適應縮放 */
    @media (orientation: portrait) {
      .main-content { flex-direction: column; }
      .weather-card { height: 20vh; }
      .big-temp { font-size: 5.5vh; }
      .route-badge-number { font-size: 3.5vh; }
      .eta-countdown-display { font-size: 3vh; }
    }

    @keyframes pulse-glow {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <header class="glass-card weather-card">
      <div class="weather-left">
        <div id="live-clock-string" class="date-time-string">--月--日 (-) 00:00:00</div>
        <div class="location-title" id="location-name-display">沙田區</div>
        <div class="temp-row">
          <div id="weather-temp-text" class="big-temp">--°C</div>
          <div class="weather-sub-metrics">
            <span id="weather-humidity-text">相對濕度：--%</span>
            <span id="weather-warning-badges" style="color:#ef4444; font-weight:bold;"></span>
          </div>
        </div>
      </div>
      <div id="weather-report-summary" class="weather-right-text">
        正在安全同步香港天文台大數據中心，獲取即時天氣概況及區域分區預測...
      </div>
    </header>

    <section class="glass-card traffic-news-card">
      <div class="traffic-icon">🚨</div>
      <div class="traffic-content-box">
        <div class="traffic-title">特別交通消息</div>
        <div id="traffic-news-container-text" class="traffic-text-container">現時交通大致正常。</div>
      </div>
    </section>

    <section class="glass-card transit-card">
      <div class="tab-navigation">
        <button class="tab-pill active" onclick="switchActiveTab('REGAL_NORTH')">富豪花園 (北行)</button>
        <button class="tab-pill" onclick="switchActiveTab('REGAL_SOUTH')">富豪花園 (南行)</button>
        <button class="tab-pill" onclick="switchActiveTab('TOWN_CENTER')">沙田市中心</button>
      </div>
      <div id="active-bus-rows-container" class="bus-grid-container">
        </div>
    </section>

  </div>

  <script>
    /**
     * 【GitHub 開源精華】靜態範圍映射數據庫 (Scoped Mapping DB)
     * 精確鎖定富豪花園街上所有分散的真實實時 HASH ID，絕無遺漏
     */
    const SMART_ENGINE_DB = {
      pollingIntervalMs: 30000, // 30秒高頻對接刷新
      tabs: {
        REGAL_NORTH: {
          stopId: "D262C76A28469C95", // 富豪花園北行真實物理亭位 HASH
          routes: [
            { route: "86K",  label: "往 沙田站" },
            { route: "89X",  label: "往 沙田站" },
            { route: "299X", label: "往 沙田市中心" },
            { route: "83K",  label: "往 沙田市中心 (循環線)" }
          ]
        },
        REGAL_SOUTH: {
          stopId: "89D529BB626B5DFA", // 富豪花園南行真實物理亭位 HASH
          routes: [
            { route: "284",  label: "往 濱景花園 (循環線)" },
            { route: "49X",  label: "往 青衣碼頭" }
          ]
        },
        TOWN_CENTER: {
          stopId: "967527636FA7D962", // 沙田市中心總站 269D 專屬坑位 HASH
          routes: [
            { route: "269D", label: "往 天富" }
          ]
        }
      }
    };

    // 全局運行狀態集
    let currentTabKey = "REGAL_NORTH";
    let globalCachedEtaDataStore = {}; // 記憶體數據中心

    const DOM = {
      clock: document.getElementById('live-clock-string'),
      location: document.getElementById('location-name-display'),
      temp: document.getElementById('weather-temp-text'),
      humidity: document.getElementById('weather-humidity-text'),
      warnings: document.getElementById('weather-warning-badges'),
      weatherSummary: document.getElementById('weather-report-summary'),
      trafficText: document.getElementById('traffic-news-container-text'),
      busContainer: document.getElementById('active-bus-rows-container')
    };

    // 1. 高精確度實時數字時鐘
    function runLiveClock() {
      const now = new Date();
      const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const day = weekdays[now.getDay()];
      const timeStr = now.toLocaleTimeString('zh-HK', { hour12: false });
      DOM.clock.textContent = `${month}月${date}日 (${day}) ${timeStr}`;
    }

    // 2. 智慧 Tab 切換器 (切換時 0 毫秒讀取內存緩存，反應極速)
    function switchActiveTab(tabKey) {
      currentTabKey = tabKey;
      document.querySelectorAll('.tab-pill').forEach(btn => {
        if (btn.getAttribute('onclick').includes(tabKey)) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      renderActiveTabUI();
    }

    // 3. 渲染當前 Tab 巴士骨架與實時倒數
    function renderActiveTabUI() {
      DOM.busContainer.innerHTML = '';
      const tabConfig = SMART_ENGINE_DB.tabs[currentTabKey];
      const now = new Date();

      tabConfig.routes.forEach((r, idx) => {
        const row = document.createElement('div');
        row.className = 'bus-data-row';
        
        // 從全局內存數據庫提取對應線路已篩選排序的 ETA 陣列
        const routeEtas = globalCachedEtaDataStore[r.route] || [];

        let slotHtml = '';
        for (let seq = 0; seq < 2; seq++) {
          if (routeEtas[seq]) {
            const data = routeEtas[seq];
            const targetTime = new Date(data.eta);
            const diffMins = Math.max(0, Math.floor((targetTime - now) / 60000));
            
            const absHour = String(targetTime.getHours()).padStart(2, '0');
            const absMin = String(targetTime.getMinutes()).padStart(2, '0');
            
            const isIncoming = diffMins === 0;
            const timeDisplay = isIncoming ? "即將抵達" : `${diffMins} 分鐘`;
            const incomingClass = isIncoming ? "incoming" : "";
            const clockDisplay = `${absHour}:${absMin} ${data.rmk_tc || ''}`;

            slotHtml += `
              <div class="eta-slot-item">
                <div class="eta-countdown-display ${incomingClass}">${timeDisplay}</div>
                <div class="eta-absolute-clock-time">${clockDisplay}</div>
              </div>`;
          } else {
            slotHtml += `
              <div class="eta-slot-item">
                <div class="eta-countdown-display">${seq === 0 ? '暫無班次' : '--'}</div>
                <div class="eta-absolute-clock-time"></div>
              </div>`;
          }
        }

        row.innerHTML = `
          <div class="bus-info-meta">
            <div class="route-badge-number">${r.route}</div>
            <div class="route-destination-text">${r.label}</div>
          </div>
          <div class="arrival-slots-wrapper">${slotHtml}</div>
        `;
        DOM.busContainer.appendChild(row);
      });
    }

    /**
     * 4. 核心改善：多重 HASH 併發直連機制 (Concurrent Multi-Fetch)
     * 每 30 秒同時把北行、南行、市中心總站的數據全部拉回，在內存內統一洗牌分流
     */
    async function executeConcurrentTransitPoll() {
      // 提取所有不重複的實時 HASH ID
      const targetStopIds = [...new Set(Object.keys(SMART_ENGINE_DB.tabs).map(k => SMART_ENGINE_DB.tabs[k].stopId))];
      
      const promises = targetStopIds.map(async (sid) => {
        try {
          // 直連政府實時交通轉發專屬域名 (天然支援網頁端跨域 CORS)
          const res = await fetch(`https://rt.data.gov.hk/v1/transport/kmb/stop-eta/${sid}`);
          if (res.ok) {
            const json = await res.json();
            return json.data || [];
          }
        } catch (e) { console.error(`Fetch target error for HASH ${sid}:`, e); }
        return [];
      });

      // 併發等待所有網路數據包歸巢
      const resultsArray = await Promise.all(promises);
      // 展平大雜燴數據包
      const megaTransitList = resultsArray.flat();

      // 清空舊記憶體，重新對號入座
      globalCachedEtaDataStore = {};

      // 將全線撈到的預報分配給目標線路，並在記憶體中完成時間去重與排序
      Object.keys(SMART_ENGINE_DB.tabs).forEach(k => {
        SMART_ENGINE_DB.tabs[k].routes.forEach(userRoute => {
          const matchedRawEtas = megaTransitList.filter(item => item.route === userRoute.route && item.eta);
          
          // 時間去重過濾器
          const uniqueEtas = [];
          const seenTimes = new Set();
          matchedRawEtas.forEach(item => {
            if (!seenTimes.has(item.eta)) {
              seenTimes.add(item.eta);
              uniqueEtas.push(item);
            }
          });

          // 嚴格依時間由近至遠排序
          uniqueEtas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
          globalCachedEtaDataStore[userRoute.route] = uniqueEtas;
        });
      });

      // 數據重組完畢，觸發前端畫面重繪
      renderActiveTabUI();
    }

    // 5. 天文台大數據與運輸署特別消息直連
    async function fetchLiveNewsAndWeather() {
      const cacheBust = Date.now();
      
      // A. 運輸署特別交通消息直連
      try {
        const res = await fetch(`https://api.data.gov.hk/v1/transport/hk/tss/special-traffic-news?lang=tc&_=${cacheBust}`);
        if (res.ok) {
          const json = await res.json();
          DOM.trafficText.textContent = (json && json.length > 0) ? json[0].msgText : "現時交通大致正常。";
        }
      } catch (e) {}

      // B. 天文台氣象中心直連
      try {
        const wRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_=${cacheBust}`);
        if (wRes.ok) {
          const wData = await wRes.json();
          
          if (wData.temperature?.data?.length > 0) {
            const shatinTemp = wData.temperature.data.find(d => d.place === "沙田");
            DOM.temp.textContent = shatinTemp ? `${shatinTemp.value}°C` : `${wData.temperature.data[0].value}°C`;
            DOM.location.textContent = shatinTemp ? "沙田區" : "香港";
          }
          if (wData.humidity?.data?.length > 0) {
            DOM.humidity.textContent = `相對濕度：${wData.humidity.data[0].value}%`;
          }
          if (wData.generalSituation) {
            DOM.weatherSummary.innerHTML = `<strong>【今日天氣概況】</strong>${wData.generalSituation}`;
          }
        }

        // 實時警告訊號同步
        const warnRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc&_=${cacheBust}`);
        if (warnRes.ok) {
          const warnData = await warnRes.json();
          const keys = Object.keys(warnData);
          DOM.warnings.textContent = keys.length > 0 ? ` ⚠️ 生效警告: ${keys.map(k => warnData[k].name).join(', ')}` : "";
        }
      } catch (e) {}
    }

    // 6. 系統主引導引擎啟動
    function startEnterpriseDashboard() {
      setInterval(runLiveClock, 1000);
      runLiveClock();

      renderActiveTabUI();

      // 建立高頻異步數據刷新排程
      async function triggerGlobalPipelineRefresh() {
        await Promise.allSettled([executeConcurrentTransitPoll(), fetchLiveNewsAndWeather()]);
      }

      setInterval(triggerGlobalPipelineRefresh, SMART_ENGINE_DB.pollingIntervalMs);
      triggerGlobalPipelineRefresh();
    }

    document.addEventListener('DOMContentLoaded', startEnterpriseDashboard);
  </script>
</body>
</html>
