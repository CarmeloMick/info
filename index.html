<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>薯屋交通 Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 10px;
        }

        /* 首次使用的智能校對面板 */
        #setup-panel {
            background-color: #222;
            border: 2px dashed #ffcc00;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: block;
        }
        #setup-panel h3 { color: #ffcc00; margin-bottom: 8px; font-size: 1.2rem; }
        #setup-panel p { font-size: 0.9rem; color: #ccc; margin-bottom: 10px; line-height: 1.4; }
        .setup-row { margin-bottom: 10px; display: flex; flex-direction: column; }
        .setup-row label { font-size: 0.95rem; font-weight: bold; margin-bottom: 4px; color: #fff; }
        .setup-row select { background: #333; color: #fff; padding: 8px; border: 1px solid #555; border-radius: 4px; font-size: 1rem; }
        .setup-btn { background: #ffcc00; color: #000; font-weight: bold; border: none; padding: 10px; border-radius: 4px; font-size: 1rem; cursor: pointer; margin-top: 5px; width: 100%; }
        
        /* 頂部時間區 (紅底) */
        .section-time {
            background-color: #b30000;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 8px;
        }
        .date { font-size: 1.4rem; font-weight: bold; color: #ffcccc; letter-spacing: 2px; }
        .time { font-size: 3.2rem; font-weight: bold; font-family: monospace; margin: 2px 0; }
        .custom-text { font-size: 1.2rem; font-weight: bold; color: #ffcc00; letter-spacing: 1px; }

        /* 中部巴士區 */
        .section-bus {
            flex: 1;
            background-color: #111;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow-y: auto;
        }
        .bus-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #222;
        }
        .bus-row:last-child { border-bottom: none; }
        .bus-info { display: flex; align-items: center; flex: 1; min-width: 0; }
        .bus-no {
            background-color: #ffcc00;
            color: #000;
            font-weight: bold;
            font-size: 1.4rem;
            padding: 3px 8px;
            border-radius: 6px;
            margin-right: 12px;
            min-width: 70px;
            text-align: center;
        }
        .bus-details { display: flex; flex-direction: column; }
        .bus-dest { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .bus-stop { font-size: 0.85rem; color: #888; margin-top: 1px; }
        .bus-eta { font-size: 1.5rem; font-weight: bold; color: #00ffcc; font-family: monospace; text-align: right; margin-left: 10px; }

        /* 底部天氣區 */
        .section-weather {
            background-color: #0044cc;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .weather-left { display: flex; flex-direction: column; }
        .temp { font-size: 3rem; font-weight: bold; line-height: 1; }
        .weather-meta { font-size: 1rem; color: #b3d1ff; margin-top: 3px; }
        
        .weather-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
        .warning-box {
            background-color: #ff3333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 4px;
            display: inline-block;
        }
        .weather-text { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .refresh-btn {
            margin-top: 5px;
            background-color: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }
        .refresh-btn:active { background-color: rgba(255,255,255,0.4); }
    </style>
</head>
<body>

    <div id="setup-panel">
        <h3>🔧 薯屋交通 • 智能車站校對</h3>
        <p id="setup-status">正在從九巴網絡安全讀取附近的車站候選名單，請稍候...</p>
        <div id="setup-fields" style="display:none;">
            <div class="setup-row">
                <label>1. 富豪花園站 (適用於 89X, 299X, 83K, 284, 49X):</label>
                <select id="sel-fuhao"><option value="">載入中...</option></select>
            </div>
            <div class="setup-row">
                <label>2. 沙田第一城站 (適用於 86K):</label>
                <select id="sel-cityone"><option value="">載入中...</option></select>
            </div>
            <div class="setup-row">
                <label>3. 沙田市中心總站 (適用於 269D):</label>
                <select id="sel-center"><option value="">載入中...</option></select>
            </div>
            <button class="setup-btn" onclick="saveCalibration()">💾 鎖定車站，啟動巴士預報</button>
        </div>
    </div>

    <div class="section-time" id="pixel-shifter">
        <div class="date" id="date-str">----/--/-- ---</div>
        <div class="time" id="time-str">00:00 --</div>
        <div class="custom-text">薯屋交通</div>
    </div>

    <div class="section-bus">
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">89X</div><div class="bus-details"><div class="bus-dest">往 沙田站</div><div class="bus-stop">富豪花園</div></div></div>
            <div class="bus-eta" id="bus-89X">待校對...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">86K</div><div class="bus-details"><div class="bus-dest">往 沙田站</div><div class="bus-stop">沙田第一城</div></div></div>
            <div class="bus-eta" id="bus-86K">待校對...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">299X</div><div class="bus-details"><div class="bus-dest">往 沙田市中心</div><div class="bus-stop">富豪花園</div></div></div>
            <div class="bus-eta" id="bus-299X">待校對...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">83K</div><div class="bus-details"><div class="bus-dest">往 沙田市中心 (循環線)</div><div class="bus-stop">富豪花園</div></div></div>
            <div class="bus-eta" id="bus-83K">待校對...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">284</div><div class="bus-details"><div class="bus-dest">往 濱景花園 (循環線)</div><div class="bus-stop">富豪花園</div></div></div>
            <div class="bus-eta" id="bus-284">待校對...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">49X</div><div class="bus-details"><div class="bus-dest">往 青衣碼頭</div><div class="bus-stop">富豪花園</div></div></div>
            <div class="bus-eta" id="bus-49X">待校對...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">269D</div><div class="bus-details"><div class="bus-dest">往 天富</div><div class="bus-stop">沙田市中心總站</div></div></div>
            <div class="bus-eta" id="bus-269D">待校對...</div>
        </div>
    </div>

    <div class="section-weather">
        <div class="weather-left">
            <div class="temp" id="weather-temp">--°C</div>
            <div class="weather-meta" id="weather-humidity">濕度: --%</div>
            <div class="weather-meta" id="weather-uv">UV 指數: --</div>
        </div>
        <div class="weather-right">
            <div id="weather-warning"></div>
            <div class="weather-text" id="weather-desc">正在連線...</div>
            <button class="refresh-btn" onclick="triggerManualRefresh()">🔄 刷新數據</button>
        </div>
    </div>

    <script>
        // 高速單一連線 Proxy，專門用來應付校對和重新加載
        async function fetchJson(url) {
            const proxy = `https://corsproxy.io/?${encodeURIComponent(url)}`;
            const res = await fetch(proxy);
            if (!res.ok) throw new Error("連線失敗");
            return await res.json();
        }

        // 核心巴士路線配置
        const busConfig = [
            { route: "89X", id: "bus-89X", cacheKey: "stop_id_fuhao" },
            { route: "86K", id: "bus-86K", cacheKey: "stop_id_cityone" },
            { route: "299X", id: "bus-299X", cacheKey: "stop_id_fuhao" },
            { route: "83K", id: "bus-83K", cacheKey: "stop_id_fuhao" },
            { route: "284", id: "bus-284", cacheKey: "stop_id_fuhao" },
            { route: "49X", id: "bus-49X", cacheKey: "stop_id_fuhao" },
            { route: "269D", id: "bus-269D", cacheKey: "stop_id_center" }
        ];

        // 啟動校對精靈：精準抓取 89X, 86K, 269D 這三條主線上的所有實體車站名
        async function runSetupWizard() {
            // 如果已經校對過，直接隱藏面板並加載
            if (localStorage.getItem("stop_id_fuhao") && localStorage.getItem("stop_id_cityone") && localStorage.getItem("stop_id_center")) {
                document.getElementById("setup-panel").style.display = "none";
                updateClock();
                fetchWeather();
                fetchBusETA();
                return;
            }

            try {
                // 我們只下載這 3 條路線的站點清單，每條只有 2KB，絕對不會超時！
                const lines = ["89X", "86K", "269D"];
                let allStops = [];

                for (let line of lines) {
                    const res = await fetchJson(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${line}/outbound/1`);
                    if (res && res.data) allStops = allStops.concat(res.data);
                    
                    const resIn = await fetchJson(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${line}/inbound/1`);
                    if (resIn && resIn.data) allStops = allStops.concat(resIn.data);
                }

                // 移除重複的車站 ID
                const uniqueStopIds = Array.from(new Set(allStops.map(item => item.stop)));
                
                document.getElementById("setup-status").textContent = `正在翻譯附近車站名稱 (共 ${uniqueStopIds.length} 個)...`;
                
                // 批次向九巴換取中文站名
                let fuhaoOptions = "", cityoneOptions = "", centerOptions = "";
                
                for (let stopId of uniqueStopIds) {
                    try {
                        const stopDetail = await fetchJson(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${stopId}`);
                        if (stopDetail && stopDetail.data) {
                            const name = stopDetail.data.name_tc;
                            
                            // 智能分類過濾：把對應的站名塞進專屬的下拉選單中
                            if (name.includes("富豪花園")) {
                                fuhaoOptions += `<option value="${stopId}">${name} (${stopId.substring(0,4)})</option>`;
                            }
                            if (name.includes("第一城")) {
                                cityoneOptions += `<option value="${stopId}">${name} (${stopId.substring(0,4)})</option>`;
                            }
                            if (name.includes("市中心")) {
                                centerOptions += `<option value="${stopId}">${name} (${stopId.substring(0,4)})</option>`;
                            }
                        }
                    } catch(e) {}
                }

                // 渲染到網頁選單上
                document.getElementById("sel-fuhao").innerHTML = fuhaoOptions || `<option value="">找不到富豪花園站</option>`;
                document.getElementById("sel-cityone").innerHTML = cityoneOptions || `<option value="">找不到第一城站</option>`;
                document.getElementById("sel-center").innerHTML = centerOptions || `<option value="">找不到市中心站</option>`;

                document.getElementById("setup-status").style.display = "none";
                document.getElementById("setup-fields").style.display = "block";

            } catch (error) {
                document.getElementById("setup-status").textContent = "❌ 校對連線超時，請點擊下方按鈕刷新重試。";
            }
        }

        // 儲存校對好的 16位元加密 ID
        function saveCalibration() {
            const fh = document.getElementById("sel-fuhao").value;
            const co = document.getElementById("sel-cityone").value;
            const ct = document.getElementById("sel-center").value;

            if(!fh || !co || !ct) {
                alert("請確保三個車站都選擇了正確的位置！");
                return;
            }

            localStorage.setItem("stop_id_fuhao", fh);
            localStorage.setItem("stop_id_cityone", co);
            localStorage.setItem("stop_id_center", ct);

            // 隱藏校對面板並立刻啟動
            document.getElementById("setup-panel").style.display = "none";
            fetchBusETA();
        }

        // 3. 獲取巴士預報（完全模仿手機 App 運作機制）
        async function fetchBusETA() {
            const fhId = localStorage.getItem("stop_id_fuhao");
            const coId = localStorage.getItem("stop_id_cityone");
            const ctId = localStorage.getItem("stop_id_center");

            if (!fhId || !coId || !ctId) return;

            busConfig.forEach(async (config) => {
                try {
                    // 根據配置動態讀取對應的車站編號
                    const targetStopId = localStorage.getItem(config.cacheKey);
                    
                    // 直攻 KMB 最底層的站點預報 API！這條連線不需要任何關鍵字過濾！
                    const url = `https://data.etabus.gov.hk/v1/transport/kmb/eta/${targetStopId}/${config.route}/1`;
                    const json = await fetchJson(url);
                    
                    if (json && json.data) {
                        // 只需要過濾出有預計時間（eta）的記錄即可
                        const validEtas = json.data.filter(item => item.eta);
                        
                        if (validEtas.length > 0) {
                            // 排序出最近的三班車
                            validEtas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
                            
                            const m1 = calculateMinutes(validEtas[0].eta);
                            const m2 = validEtas[1] ? calculateMinutes(validEtas[1].eta) : '--';
                            
                            document.getElementById(config.id).textContent = m2 !== '--' ? `${m1} / ${m2}` : `${m1}`;
                        } else {
                            document.getElementById(config.id).textContent = "未有班次";
                        }
                    }
                } catch (error) {
                    document.getElementById(config.id).textContent = "網絡延遲";
                }
            });
        }

        function calculateMinutes(etaTimeStr) {
            if (!etaTimeStr) return '--';
            const diffMins = Math.ceil((new Date(etaTimeStr) - new Date()) / 1000 / 60);
            return diffMins <= 0 ? "即將到站" : `${diffMins} 鐘`;
        }

        function updateClock() {
            const now = new Date();
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            let hours = now.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('date-str').textContent = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${days[now.getDay()]}`;
            document.getElementById('time-str').textContent = `${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;
        }

        async function fetchWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                let shatinTemp = data.temperature.data.find(item => item.place === '沙田');
                if(shatinTemp) document.getElementById('weather-temp').textContent = `${shatinTemp.value}°C`;
                if(data.humidity) document.getElementById('weather-humidity').textContent = `濕度: ${data.humidity.data[0].value}%`;
                if(data.uvindex && data.uvindex.data.length > 0) {
                    document.getElementById('weather-uv').textContent = `UV 指數: ${data.uvindex.data[0].value}`;
                } else {
                    document.getElementById('weather-uv').textContent = `UV 指數: 0`;
                }
                
                const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await warnRes.json();
                const warnBox = document.getElementById('weather-warning');
                warnBox.innerHTML = '';
                if (Object.keys(warnData).length > 0) {
                    for (let key in warnData) {
                        warnBox.innerHTML += `<div class="warning-box">${warnData[key].name}</div> `;
                    }
                    document.getElementById('weather-desc').textContent = "請注意警告";
                } else {
                    document.getElementById('weather-desc').textContent = "天氣大致良好";
                }
            } catch (error) {
                document.getElementById('weather-desc').textContent = "天氣更新失敗";
            }
        }

        function triggerManualRefresh() {
            const btn = document.querySelector('.refresh-btn');
            btn.textContent = "⏳ 更新中...";
            fetchWeather();
            if (localStorage.getItem("stop_id_fuhao")) {
                fetchBusETA();
            } else {
                runSetupWizard();
            }
            setTimeout(() => { btn.textContent = "🔄 刷新數據"; }, 1200);
        }

        function pixelShift() {
            const shifter = document.getElementById('pixel-shifter');
            shifter.style.transform = `translate(${Math.floor(Math.random() * 3) - 1}px, ${Math.floor(Math.random() * 3) - 1}px)`;
        }

        // 啟動程序
        updateClock();
        fetchWeather();
        runSetupWizard(); // 執行校對精靈

        setInterval(updateClock, 1000);
        setInterval(fetchBusETA, 30000); // 每 30 秒自動向選定的車站要數據
        setInterval(fetchWeather, 300000);
        setInterval(pixelShift, 600000);
    </script>
</body>
</html>
