<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Transit & Weather Dashboard</title>
  <style>
    /* 全局高級深色主題重設 (完美對齊目標圖片色彩與質感) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #0b0f19; /* 極致深藍黑底色 */
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 1.5vh 1.5vw;
    }

    .dashboard-container {
      display: flex;
      flex-direction: column;
      height: 97vh;
      gap: 1.5vh;
    }

    /* 高級灰藍色面板卡片 */
    .glass-card {
      background-color: #131c2e; 
      border: 1px solid #22314d;
      border-radius: 16px;
      padding: 2vh 2vw;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* 區塊 C：頂部天氣面版 */
    .weather-card {
      display: flex;
      gap: 3vw;
      height: 22vh;
    }
    .weather-left {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid #22314d;
      padding-right: 2vw;
    }
    .date-time-string {
      font-size: 2vh;
      color: #94a3b8;
      margin-bottom: 0.5vh;
      font-variant-numeric: tabular-nums;
    }
    .location-title {
      font-size: 3vh;
      font-weight: bold;
      color: #38bdf8;
    }
    .temp-row {
      display: flex;
      align-items: center;
      gap: 1.5vw;
      margin-top: 0.5vh;
    }
    .big-temp {
      font-size: 6.8vh;
      font-weight: bold;
      line-height: 1;
      color: #ffffff;
    }
    .weather-sub-metrics {
      font-size: 1.9vh;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 0.3vh;
    }
    .weather-right-text {
      flex: 2;
      font-size: 1.9vh;
      color: #cbd5e1;
      line-height: 1.6;
      overflow-y: auto;
      padding-right: 0.5vw;
    }

    /* 區塊 D：特別交通消息組件 */
    .traffic-news-card {
      height: 10vh;
      display: flex;
      align-items: center;
      gap: 1.5vw;
      background-color: #16223f;
      border: 1px solid #2e4374;
      padding: 0 2vw;
    }
    .traffic-icon {
      font-size: 3.5vh;
    }
    .traffic-content-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .traffic-title {
      font-size: 2vh;
      font-weight: bold;
      color: #f43f5e; 
      margin-bottom: 0.2vh;
    }
    .traffic-text-container {
      font-size: 1.8vh;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 區塊 B：巴士看板分區 */
    .transit-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5vh;
      min-height: 0;
    }
    
    /* 高級導航 Pills Tabs */
    .tab-navigation {
      display: flex;
      gap: 1vw;
      border-bottom: 1px solid #22314d;
      padding-bottom: 1.2vh;
    }
    .tab-pill {
      background-color: #1e293b;
      color: #94a3b8;
      border: none;
      padding: 1vh 2vw;
      font-size: 2vh;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }
    .tab-pill.active {
      background-color: #2563eb; 
      color: #ffffff;
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
    }

    /* 巴士數據網格 */
    .bus-grid-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.6vh;
      overflow-y: auto;
      min-height: 0;
    }
    .bus-data-row {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 1.4vh 2vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .bus-info-meta {
      display: flex;
      flex-direction: column;
    }
    .route-badge-number {
      font-size: 4.2vh;
      font-weight: 900;
      color: #eab308; 
      line-height: 1;
    }
    .route-destination-text {
      font-size: 1.8vh;
      color: #64748b;
      margin-top: 0.5vh;
    }
    .arrival-slots-wrapper {
      display: flex;
      gap: 4vw;
    }
    .eta-slot-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      min-width: 10vw;
    }
    .eta-countdown-display {
      font-size: 3.6vh;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }
    .eta-countdown-display.incoming {
      color: #22c55e; 
    }
    .eta-absolute-clock-time {
      font-size: 1.7vh;
      color: #64748b;
      margin-top: 0.2vh;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <header class="glass-card weather-card">
      <div class="weather-left">
        <div id="live-clock-string" class="date-time-string">--月--日 (-) 00:00:00</div>
        <div class="location-title" id="location-name-display">沙田區</div>
        <div class="temp-row">
          <div id="weather-temp-text" class="big-temp">--°C</div>
          <div class="weather-sub-metrics">
            <span id="weather-humidity-text">相對濕度：--%</span>
            <span id="weather-warning-badges" style="color:#ef4444; font-weight:bold;"></span>
          </div>
        </div>
      </div>
      <div id="weather-report-summary" class="weather-right-text">
        正在安全同步香港天文台大數據中心，獲取即時天氣概況及區域分區預測...
      </div>
    </header>

    <section class="glass-card traffic-news-card">
      <div class="traffic-icon">🚨</div>
      <div class="traffic-content-box">
        <div class="traffic-title">特別交通消息</div>
        <div id="traffic-news-container-text" class="traffic-text-container">現時交通大致正常。</div>
      </div>
    </section>

    <section class="glass-card transit-card">
      <div class="tab-navigation">
        <button class="tab-pill active" onclick="switchActiveTab('REGAL_NORTH')">富豪花園 (北行)</button>
        <button class="tab-pill" onclick="switchActiveTab('REGAL_SOUTH')">富豪花園 (南行)</button>
        <button class="tab-pill" onclick="switchActiveTab('TOWN_CENTER')">沙田市中心</button>
      </div>
      <div id="active-bus-rows-container" class="bus-grid-container"></div>
    </section>

  </div>

  <script>
    // 內置精確 Scoped 數據庫，徹底杜絕無班次及名冊閃退問題
    const SMART_ENGINE_DB = {
      pollingIntervalMs: 30000, // 30秒直連刷新
      tabs: {
        REGAL_NORTH: {
          stopId: "D262C76A28469C95", 
          routes: [
            { route: "86K",  label: "往 沙田站" },
            { route: "89X",  label: "往 沙田站" },
            { route: "299X", label: "往 沙田市中心" },
            { route: "83K",  label: "往 沙田市中心 (循環線)" }
          ]
        },
        REGAL_SOUTH: {
          stopId: "89D529BB626B5DFA", 
          routes: [
            { route: "284",  label: "往 濱景花園 (循環線)" },
            { route: "49X",  label: "往 青衣碼頭" }
          ]
        },
        TOWN_CENTER: {
          stopId: "967527636FA7D962", 
          routes: [
            { route: "269D", label: "往 天富" }
          ]
        }
      }
    };

    let currentTabKey = "REGAL_NORTH";
    let globalCachedEtaStore = {}; 

    const DOM = {
      clock: document.getElementById('live-clock-string'),
      location: document.getElementById('location-name-display'),
      temp: document.getElementById('weather-temp-text'),
      humidity: document.getElementById('weather-humidity-text'),
      warnings: document.getElementById('weather-warning-badges'),
      weatherSummary: document.getElementById('weather-report-summary'),
      trafficText: document.getElementById('traffic-news-container-text'),
      busContainer: document.getElementById('active-bus-rows-container')
    };

    function runLiveClock() {
      const now = new Date();
      const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
      DOM.clock.textContent = (now.getMonth() + 1) + "月" + now.getDate() + "日 (" + weekdays[now.getDay()] + ") " + now.toLocaleTimeString('zh-HK', { hour12: false });
    }

    function switchActiveTab(tabKey) {
      currentTabKey = tabKey;
      var buttons = document.querySelectorAll('.tab-pill');
      for (var i = 0; i < buttons.length; i++) {
        if (buttons[i].getAttribute('onclick').indexOf(tabKey) !== -1) {
          buttons[i].classList.add('active');
        } else {
          buttons[i].classList.remove('active');
        }
      }
      renderActiveTabUI();
    }

    function renderActiveTabUI() {
      DOM.busContainer.innerHTML = '';
      const tabConfig = SMART_ENGINE_DB.tabs[currentTabKey];
      const now = new Date();

      tabConfig.routes.forEach(function(r, idx) {
        const row = document.createElement('div');
        row.className = 'bus-data-row';
        const routeEtas = globalCachedEtaStore[r.route] || [];

        let slotHtml = '';
        for (let seq = 0; seq < 2; seq++) {
          if (routeEtas[seq]) {
            const data = routeEtas[seq];
            const targetTime = new Date(data.eta);
            const diffMins = Math.max(0, Math.floor((targetTime - now) / 60000));
            
            const absHour = String(targetTime.getHours()).padStart(2, '0');
            const absMin = String(targetTime.getMinutes()).padStart(2, '0');
            
            const isIncoming = diffMins === 0;
            const timeDisplay = isIncoming ? "即將抵達" : diffMins + " 分鐘";
            const incomingClass = isIncoming ? "incoming" : "";
            const clockDisplay = absHour + ":" + absMin + " " + (data.rmk_tc || '');

            slotHtml += '<div class="eta-slot-item">' +
                        '<div class="eta-countdown-display ' + incomingClass + '">' + timeDisplay + '</div>' +
                        '<div class="eta-absolute-clock-time">' + clockDisplay + '</div>' +
                        '</div>';
          } else {
            slotHtml += '<div class="eta-slot-item">' +
                        '<div class="eta-countdown-display">' + (seq === 0 ? '暫無班次' : '--') + '</div>' +
                        '<div class="eta-absolute-clock-time"></div>' +
                        '</div>';
          }
        }

        row.innerHTML = '<div class="bus-info-meta">' +
                        '<div class="route-badge-number">' + r.route + '</div>' +
                        '<div class="route-destination-text">' + r.label + '</div>' +
                        '</div>' +
                        '<div class="arrival-slots-wrapper">' + slotHtml + '</div>';
        DOM.busContainer.appendChild(row);
      });
    }

    // 採用舊 iPad 100% 支援的傳統非同步循環，徹底擯棄 Promise.allSettled
    async function executeGlobalTransitPoll() {
      const keys = Object.keys(SMART_ENGINE_DB.tabs);
      const megaMergedList = [];

      for (let i = 0; i < keys.length; i++) {
        const tabKey = keys[i];
        const sid = SMART_ENGINE_DB.tabs[tabKey].stopId;
        try {
          // 直連九巴開放數據公共節點 (天然支援 CORS 跨域)
          const res = await fetch('https://data.etabus.kmb.hk/v1/transport/kmb/stop-eta/' + sid);
          if (res.ok) {
            const json = await res.json();
            const arr = json.data || [];
            for (let j = 0; j < arr.length; j++) {
              megaMergedList.push(arr[j]);
            }
          }
        } catch (e) { console.error(e); }
      }

      globalCachedEtaStore = {};

      keys.forEach(function(k) {
        SMART_ENGINE_DB.tabs[k].routes.forEach(function(userRoute) {
          const matchedRawEtas = megaMergedList.filter(function(item) {
            return item.route === userRoute.route && item.eta;
          });
          
          const uniqueEtas = [];
          const seenTimes = new Set();
          matchedRawEtas.forEach(function(item) {
            if (!seenTimes.has(item.eta)) {
              seenTimes.add(item.eta);
              uniqueEtas.push(item);
            }
          });

          uniqueEtas.sort(function(a, b) {
            return new Date(a.eta) - new Date(b.eta);
          });
          globalCachedEtaStore[userRoute.route] = uniqueEtas;
        });
      });

      renderActiveTabUI();
    }

    async function fetchLiveNewsAndWeather() {
      const cacheBust = Date.now();
      
      try {
        const res = await fetch('https://api.data.gov.hk/v1/transport/hk/tss/special-traffic-news?lang=tc&_=' + cacheBust);
        if (res.ok) {
          const json = await res.json();
          DOM.trafficText.textContent = (json && json.length > 0) ? json[0].msgText : "現時交通大致正常。";
        }
      } catch (e) {}

      try {
        const wRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_=' + cacheBust);
        if (wRes.ok) {
          const wData = await wRes.json();
          
          if (wData && wData.temperature && wData.temperature.data && wData.temperature.data.length > 0) {
            let shatinTemp = null;
            for (let i = 0; i < wData.temperature.data.length; i++) {
              if (wData.temperature.data[i].place === "沙田") {
                shatinTemp = wData.temperature.data[i];
                break;
              }
            }
            DOM.temp.textContent = shatinTemp ? shatinTemp.value + "°C" : wData.temperature.data[0].value + "°C";
            DOM.location.textContent = shatinTemp ? "沙田區" : "香港";
          }
          if (wData && wData.humidity && wData.humidity.data && wData.humidity.data.length > 0) {
            DOM.humidity.textContent = "相對濕度：" + wData.humidity.data[0].value + "%";
          }
          if (wData && wData.generalSituation) {
            DOM.weatherSummary.innerHTML = "<strong>【今日天氣概況】</strong>" + wData.generalSituation;
          }
        }

        const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc&_=' + cacheBust);
        if (warnRes.ok) {
          const warnData = await warnRes.json();
          const keys = Object.keys(warnData);
          if (keys.length > 0) {
            let names = [];
            for (let i = 0; i < keys.length; i++) { names.push(warnData[keys[i]].name); }
            DOM.warnings.textContent = " ⚠️ 生效警告: " + names.join(', ');
          } else {
            DOM.warnings.textContent = "";
          }
        }
      } catch (e) {}
    }

    async function startEngine() {
      runLiveClock();
      setInterval(runLiveClock, 1000);

      renderActiveTabUI();

      await fetchLiveNewsAndWeather();
      await executeGlobalTransitPoll();

      setInterval(async function() {
        await fetchLiveNewsAndWeather();
        await executeGlobalTransitPoll();
      }, SMART_ENGINE_DB.pollingIntervalMs);
    }

    // 解決部分舊 iOS WebKit 監聽 DOMContentLoaded 不發火的 Race Condition Bug
    if (document.readyState === "complete" || document.readyState === "interactive") {
      startEngine();
    } else {
      document.addEventListener('DOMContentLoaded', startEngine);
    }
  </script>
</body>
</html>
