<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>薯屋交通 Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 10px;
        }

        /* 頂部時間區 (紅底) */
        .section-time {
            background-color: #b30000;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 8px;
        }
        .date { font-size: 1.4rem; font-weight: bold; color: #ffcccc; letter-spacing: 2px; }
        .time { font-size: 3.2rem; font-weight: bold; font-family: monospace; margin: 2px 0; }
        .custom-text { font-size: 1.2rem; font-weight: bold; color: #ffcc00; letter-spacing: 1px; }

        /* 中部巴士區 (黑底帶線) - 調整為可容納更多路線 */
        .section-bus {
            flex: 1;
            background-color: #111;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow-y: auto;
        }
        .bus-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #222;
        }
        .bus-row:last-child { border-bottom: none; }
        .bus-info { display: flex; align-items: center; flex: 1; min-width: 0; }
        .bus-no {
            background-color: #ffcc00;
            color: #000;
            font-weight: bold;
            font-size: 1.4rem;
            padding: 3px 8px;
            border-radius: 6px;
            margin-right: 12px;
            min-width: 70px;
            text-align: center;
        }
        .bus-details {
            display: flex;
            flex-direction: column;
        }
        .bus-dest { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .bus-stop { font-size: 0.85rem; color: #888; margin-top: 1px; }
        .bus-eta { font-size: 1.5rem; font-weight: bold; color: #00ffcc; font-family: monospace; text-align: right; margin-left: 10px; }

        /* 底部天氣區 (藍底) */
        .section-weather {
            background-color: #0044cc;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .weather-left { display: flex; flex-direction: column; }
        .temp { font-size: 3rem; font-weight: bold; line-height: 1; }
        .weather-meta { font-size: 1rem; color: #b3d1ff; margin-top: 3px; }
        .weather-right { text-align: right; }
        .warning-box {
            background-color: #ff3333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 4px;
            display: inline-block;
        }
        .weather-text { font-size: 1.1rem; font-weight: bold; color: #fff; }
    </style>
</head>
<body>

    <div class="section-time" id="pixel-shifter">
        <div class="date" id="date-str">----/--/-- ---</div>
        <div class="time" id="time-str">00:00 --</div>
        <div class="custom-text">薯屋交通</div>
    </div>

    <div class="section-bus">
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">89X</div><div class="bus-details"><div class="bus-dest">往 沙田站</div><div class="bus-stop">富豪花園 (ST511)</div></div></div>
            <div class="bus-eta" id="bus-89X">讀取中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">86K</div><div class="bus-details"><div class="bus-dest">往 沙田站</div><div class="bus-stop">沙田第一城 (ST507)</div></div></div>
            <div class="bus-eta" id="bus-86K">讀取中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">299X</div><div class="bus-details"><div class="bus-dest">往 沙田市中心</div><div class="bus-stop">富豪花園 (ST511)</div></div></div>
            <div class="bus-eta" id="bus-299X">讀取中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">83K</div><div class="bus-details"><div class="bus-dest">往 沙田市中心 (循環線)</div><div class="bus-stop">富豪花園 (ST511)</div></div></div>
            <div class="bus-eta" id="bus-83K">讀取中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">284</div><div class="bus-details"><div class="bus-dest">往 濱景花園 (循環線)</div><div class="bus-stop">富豪花園 (ST511)</div></div></div>
            <div class="bus-eta" id="bus-284">讀取中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">49X</div><div class="bus-details"><div class="bus-dest">往 青衣碼頭</div><div class="bus-stop">富豪花園 (ST512)</div></div></div>
            <div class="bus-eta" id="bus-49X">讀取中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">269D</div><div class="bus-details"><div class="bus-dest">往 天富</div><div class="bus-stop">沙田市中心總站 (ST912)</div></div></div>
            <div class="bus-eta" id="bus-269D">讀取中...</div>
        </div>
    </div>

    <div class="section-weather">
        <div class="weather-left">
            <div class="temp" id="weather-temp">--°C</div>
            <div class="weather-meta" id="weather-humidity">濕度: --%</div>
            <div class="weather-meta" id="weather-uv">UV 指數: --</div>
        </div>
        <div class="weather-right">
            <div id="weather-warning"></div>
            <div class="weather-text" id="weather-desc">正在連線...</div>
        </div>
    </div>

    <script>
        // 配置路線與對應的車站代號前綴
        const busConfig = [
            { route: "89X", stopPrefix: "ST11", id: "bus-89X", dir: "O" }, // 富豪花園 ST511 (API通常去前綴代號)
            { route: "86K", stopPrefix: "ST07", id: "bus-86K", dir: "O" }, // 沙田第一城 ST507
            { route: "299X", stopPrefix: "ST11", id: "bus-299X", dir: "O" }, // 富豪花園 ST511
            { route: "83K", stopPrefix: "ST11", id: "bus-83K", dir: "O" }, // 富豪花園 ST511
            { route: "284", stopPrefix: "ST11", id: "bus-284", dir: "O" }, // 富豪花園 ST511
            { route: "49X", stopPrefix: "ST12", id: "bus-49X", dir: "O" }, // 富豪花園 ST512
            { route: "269D", stopPrefix: "ST91", id: "bus-269D", dir: "O" }  // 沙田市中心總站 ST912
        ];

        // 1. 更新時間同日期
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const dayStr = days[now.getDay()];
            
            let hours = now.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('date-str').textContent = `${year}/${month}/${date} ${dayStr}`;
            document.getElementById('time-str').textContent = `${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;
        }

        // 2. 拿取香港天文台數據
        async function fetchWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                
                // 優先拿取沙田區溫度，如果冇就用總部溫度
                let shatinTemp = data.temperature.data.find(item => item.place === '沙田');
                if(shatinTemp) {
                    document.getElementById('weather-temp').textContent = `${shatinTemp.value}°C`;
                } else if(data.temperature && data.temperature.data.length > 0) {
                    document.getElementById('weather-temp').textContent = `${data.temperature.data[0].value}°C`;
                }

                if(data.humidity && data.humidity.data.length > 0) {
                    document.getElementById('weather-humidity').textContent = `濕度: ${data.humidity.data[0].value}%`;
                }
                if(data.uvindex && data.uvindex.data.length > 0) {
                    document.getElementById('weather-uv').textContent = `UV 指數: ${data.uvindex.data[0].value}`;
                } else {
                    document.getElementById('weather-uv').textContent = `UV 指數: 0`;
                }
                
                const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await warnRes.json();
                const warnBox = document.getElementById('weather-warning');
                warnBox.innerHTML = '';
                
                if (Object.keys(warnData).length > 0) {
                    for (let key in warnData) {
                        const warn = warnData[key];
                        warnBox.innerHTML += `<div class="warning-box">${warn.name}</div> `;
                    }
                    document.getElementById('weather-desc').textContent = "請注意警告";
                } else {
                    document.getElementById('weather-desc').textContent = "天氣大致良好";
                }
            } catch (error) {
                console.error("天氣獲取失敗", error);
            }
        }

        // 3. 批次拿取所有巴士線的 ETA
        async function fetchAllBusETA() {
            busConfig.forEach(async (config) => {
                try {
                    // 透過路線直接獲取該線所有站點的 ETA
                    const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${config.route}/1`);
                    const json = await res.json();
                    
                    // 篩選出匹配指定車站代號前綴 (如 ST11) 以及方向的班次
                    const etas = json.data.filter(item => item.stop.startsWith(config.stopPrefix) && item.dir === config.dir && item.eta);
                    
                    if(etas.length > 0) {
                        const nextBus1 = calculateMinutes(etas[0].eta);
                        const nextBus2 = etas[1] ? calculateMinutes(etas[1].eta) : '--';
                        
                        // 格式化輸出：例如 "5 鐘 / 18 鐘"
                        let displayStr = `${nextBus1}`;
                        if (nextBus2 !== '--') {
                            displayStr += ` / ${nextBus2}`;
                        }
                        document.getElementById(config.id).textContent = displayStr;
                    } else {
                        document.getElementById(config.id).textContent = "未有班次";
                    }
                } catch (error) {
                    document.getElementById(config.id).textContent = "連線失敗";
                }
            });
        }

        // 計算剩餘分鐘數
        function calculateMinutes(etaTimeStr) {
            if (!etaTimeStr) return '--';
            const eta = new Date(etaTimeStr);
            const now = new Date();
            const diffMs = eta - now;
            const diffMins = Math.ceil(diffMs / 1000 / 60);
            return diffMins <= 0 ? "即將到站" : `${diffMins} 鐘`;
        }

        // 4. 防燒印微移
        function pixelShift() {
            const shifter = document.getElementById('pixel-shifter');
            const randomX = Math.floor(Math.random() * 3) - 1;
            const randomY = Math.floor(Math.random() * 3) - 1;
            shifter.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        // --- 啟動與定時器 ---
        updateClock();
        fetchWeather();
        fetchAllBusETA();

        setInterval(updateClock, 1000);       // 每秒更新時間
        setInterval(fetchAllBusETA, 30000);   // 每 30 秒更新全部巴士
        setInterval(fetchWeather, 300000);   // 每 5 分鐘更新天氣
        setInterval(pixelShift, 600000);     // 每 10 分鐘防燒印
    </script>
</body>
</html>
