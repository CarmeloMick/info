<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>薯屋交通 Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 10px;
        }

        /* 頂部時間區 (紅底) */
        .section-time {
            background-color: #b30000;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 8px;
        }
        .date { font-size: 1.4rem; font-weight: bold; color: #ffcccc; letter-spacing: 2px; }
        .time { font-size: 3.2rem; font-weight: bold; font-family: monospace; margin: 2px 0; }
        .custom-text { font-size: 1.2rem; font-weight: bold; color: #ffcc00; letter-spacing: 1px; }
        .status-msg { font-size: 0.9rem; color: #ffcccc; margin-top: 3px; font-weight: normal; }

        /* 中部巴士區 */
        .section-bus {
            flex: 1;
            background-color: #111;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow-y: auto;
        }
        .bus-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #222;
        }
        .bus-row:last-child { border-bottom: none; }
        .bus-info { display: flex; align-items: center; flex: 1; min-width: 0; }
        .bus-no {
            background-color: #ffcc00;
            color: #000;
            font-weight: bold;
            font-size: 1.4rem;
            padding: 3px 8px;
            border-radius: 6px;
            margin-right: 12px;
            min-width: 70px;
            text-align: center;
        }
        .bus-details { display: flex; flex-direction: column; }
        .bus-dest { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .bus-stop { font-size: 0.85rem; color: #888; margin-top: 1px; }
        .bus-eta { font-size: 1.5rem; font-weight: bold; color: #00ffcc; font-family: monospace; text-align: right; margin-left: 10px; }

        /* 底部天氣區 */
        .section-weather {
            background-color: #0044cc;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .weather-left { display: flex; flex-direction: column; }
        .temp { font-size: 3rem; font-weight: bold; line-height: 1; }
        .weather-meta { font-size: 1rem; color: #b3d1ff; margin-top: 3px; }
        
        .weather-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
        .warning-box {
            background-color: #ff3333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 4px;
            display: inline-block;
        }
        .weather-text { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .refresh-btn {
            margin-top: 5px;
            background-color: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }
        .refresh-btn:active { background-color: rgba(255,255,255,0.4); }
        .reset-link { color: rgba(255,255,255,0.3); font-size: 0.75rem; text-decoration: none; margin-top: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="section-time" id="pixel-shifter">
        <div class="date" id="date-str">----/--/-- ---</div>
        <div class="time" id="time-str">00:00 --</div>
        <div class="custom-text">薯屋交通</div>
        <div class="status-msg" id="bus-status-message">🤖 正在初始化智能全自動配對系統...</div>
    </div>

    <div class="section-bus">
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">89X</div><div class="bus-details"><div class="bus-dest">往 沙田站</div><div class="bus-stop">富豪花園</div></div></div>
            <div class="bus-eta" id="bus-89X">連線中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">86K</div><div class="bus-details"><div class="bus-dest">往 沙田站</div><div class="bus-stop">沙田第一城</div></div></div>
            <div class="bus-eta" id="bus-86K">連線中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">299X</div><div class="bus-details"><div class="bus-dest">往 沙田市中心</div><div class="bus-stop">富豪花園</div></div></div>
            <div class="bus-eta" id="bus-299X">連線中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">83K</div><div class="bus-details"><div class="bus-dest">往 沙田市中心 (循環線)</div><div class="bus-stop">富豪花園</div></div></div>
            <div class="bus-eta" id="bus-83K">連線中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">284</div><div class="bus-details"><div class="bus-dest">往 濱景花園 (循環線)</div><div class="bus-stop">富豪花園</div></div></div>
            <div class="bus-eta" id="bus-284">連線中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">49X</div><div class="bus-details"><div class="bus-dest">往 青衣碼頭</div><div class="bus-stop">富豪花園</div></div></div>
            <div class="bus-eta" id="bus-49X">連線中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">269D</div><div class="bus-details"><div class="bus-dest">往 天富</div><div class="bus-stop">沙田市中心總站</div></div></div>
            <div class="bus-eta" id="bus-269D">連線中...</div>
        </div>
    </div>

    <div class="section-weather">
        <div class="weather-left">
            <div class="temp" id="weather-temp">--°C</div>
            <div class="weather-meta" id="weather-humidity">濕度: --%</div>
            <div class="weather-meta" id="weather-uv">UV 指數: --</div>
        </div>
        <div class="weather-right">
            <div id="weather-warning"></div>
            <div class="weather-text" id="weather-desc">正在連線...</div>
            <button class="refresh-btn" onclick="triggerManualRefresh()">🔄 刷新數據</button>
            <span class="reset-link" onclick="resetSystemCache()">重設系統</span>
        </div>
    </div>

    <script>
        // 7條路線對應的自動搜尋關鍵字
        const busConfig = [
            { route: "89X", stopNeedle: "富豪花園", id: "bus-89X" },
            { route: "86K", stopNeedle: "沙田第一城", id: "bus-86K" },
            { route: "299X", stopNeedle: "富豪花園", id: "bus-299X" },
            { route: "83K", stopNeedle: "富豪花園", id: "bus-83K" },
            { route: "284", stopNeedle: "富豪花園", id: "bus-284" },
            { route: "49X", stopNeedle: "富豪花園", id: "bus-49X" },
            { route: "269D", stopNeedle: "沙田市中心", id: "bus-269D" }
        ];

        let stopMap = {};
        let isSystemReady = false;

        // 核心邏輯：高速下載 3MB 原始檔，只在首次加載執行（耗時約 2 秒），之後永久快取
        async function initStopDatabase() {
            if (localStorage.getItem("shatin_kmb_ready") === "true") {
                // 如果以前已經成功建立過本地站名庫，直接讀取
                busConfig.forEach(c => {
                    stopMap[localStorage.getItem(`stop_id_${c.id}`)] = c.stopNeedle;
                });
                isSystemReady = true;
                document.getElementById('bus-status-message').textContent = "✅ 系統已自動對時鎖定車站";
                fetchAndRenderETA();
                return;
            }

            document.getElementById('bus-status-message').textContent = "⌛ 首次啟動：正在全自動對時鎖定沙田巴士站 (只需幾秒)...";

            try {
                // 使用 corsproxy.io 的 RAW 模式直連，不進行包裹包裝，速度極快且絕不超時
                const res = await fetch("https://corsproxy.io/?https://data.etabus.gov.hk/v1/transport/kmb/stop");
                if (!res.ok) throw new Error("RAW Channel Offline");
                const json = await res.json();

                if (json && json.data) {
                    // 全自動交叉比對，只撈取我們需要的這幾個目標站，縮減體積永久塞入 localStorage
                    json.data.forEach(item => {
                        if (item.name_tc.includes("富豪花園") || item.name_tc.includes("第一城") || item.name_tc.includes("沙田市中心")) {
                            stopMap[item.stop] = item.name_tc;
                        }
                    });

                    // 背景深入分析 7 條路線的結構，利用「升序法則」自動挑選出最正確的實體站點 ID
                    for (let config of busConfig) {
                        const etaUrl = `https://corsproxy.io/?https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${config.route}/1`;
                        const etaRes = await fetch(etaUrl);
                        const etaJson = await etaRes.json();

                        if (etaJson && etaJson.data) {
                            // 找出所有名字相符的站點記錄
                            let candidates = etaJson.data.filter(item => {
                                const realName = stopMap[item.stop];
                                return realName && realName.includes(config.stopNeedle) && item.seq;
                            });

                            if (candidates.length > 0) {
                                // 升序排序：如果是循環線或重複站點，永遠挑選序號（seq）最小的那一個（即去程 leg），100% 準確！
                                candidates.sort((a, b) => a.seq - b.seq);
                                const chosen = candidates[0];

                                // 永久鎖定該路線的實體數據標籤
                                localStorage.setItem(`locked_dir_${config.route}`, chosen.dir);
                                localStorage.setItem(`locked_seq_${config.route}`, chosen.seq);
                                localStorage.setItem(`stop_id_${config.id}`, chosen.stop);
                            }
                        }
                    }

                    localStorage.setItem("shatin_kmb_ready", "true");
                    isSystemReady = true;
                    document.getElementById('bus-status-message').textContent = "✅ 系統已自動對時鎖定車站";
                    fetchAndRenderETA();
                }
            } catch (error) {
                document.getElementById('bus-status-message').textContent = "⚠️ 網絡繁忙，4秒後自動重試對時...";
                setTimeout(initStopDatabase, 4000);
            }
        }

        // 常駐渲染功能：0秒無痛加載，直接向九巴獲取時間
        async function fetchAndRenderETA() {
            if (!isSystemReady) return;

            busConfig.forEach(async (config) => {
                try {
                    const savedDir = localStorage.getItem(`locked_dir_${config.route}`);
                    const savedSeq = localStorage.getItem(`locked_seq_${config.route}`);

                    if (!savedDir || !savedSeq) return;

                    // 每次刷新只抓取 20KB 的小檔案，速度極快
                    const url = `https://corsproxy.io/?https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${config.route}/1`;
                    const res = await fetch(url);
                    const json = await res.json();

                    if (json && json.data) {
                        const matched = json.data.filter(item => item.dir === savedDir && parseInt(item.seq) === parseInt(savedSeq) && item.eta);
                        
                        if (matched.length > 0) {
                            matched.sort((a, b) => new Date(a.eta) - new Date(b.eta));
                            const m1 = calculateMinutes(matched[0].eta);
                            const m2 = matched[1] ? calculateMinutes(matched[1].eta) : '--';
                            
                            document.getElementById(config.id).textContent = m2 !== '--' ? `${m1} / ${m2}` : `${m1}`;
                        } else {
                            document.getElementById(config.id).textContent = "未有班次";
                        }
                    }
                } catch (error) {
                    document.getElementById(config.id).textContent = "網絡延遲";
                }
            });
        }

        // 格式化倒數：即將到站轉為 "-", 修正為 "分鐘"
        function calculateMinutes(etaTimeStr) {
            if (!etaTimeStr) return '--';
            const diffMins = Math.ceil((new Date(etaTimeStr) - new Date()) / 1000 / 60);
            return diffMins <= 0 ? "-" : `${diffMins} 分鐘`;
        }

        function updateClock() {
            const now = new Date();
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            let hours = now.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('date-str').textContent = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${days[now.getDay()]}`;
            document.getElementById('time-str').textContent = `${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;
        }

        async function fetchWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                let shatinTemp = data.temperature.data.find(item => item.place === 'shaTin' || item.place === '沙田');
                if(shatinTemp) {
                    document.getElementById('weather-temp').textContent = `${shatinTemp.value}°C`;
                } else if (data.temperature && data.temperature.data.length > 0) {
                    document.getElementById('weather-temp').textContent = `${data.temperature.data[0].value}°C`;
                }
                if(data.humidity) document.getElementById('weather-humidity').textContent = `濕度: ${data.humidity.data[0].value}%`;
                if(data.uvindex && data.uvindex.data.length > 0) {
                    document.getElementById('weather-uv').textContent = `UV 指數: ${data.uvindex.data[0].value}`;
                } else {
                    document.getElementById('weather-uv').textContent = `UV 指數: 0`;
                }
                
                const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await warnRes.json();
                const warnBox = document.getElementById('weather-warning');
                warnBox.innerHTML = '';
                if (Object.keys(warnData).length > 0) {
                    for (let key in warnData) {
                        warnBox.innerHTML += `<div class="warning-box">${warnData[key].name}</div> `;
                    }
                    document.getElementById('weather-desc').textContent = "請注意警告";
                } else {
                    document.getElementById('weather-desc').textContent = "天氣大致良好";
                }
            } catch (error) {
                document.getElementById('weather-desc').textContent = "天氣更新失敗";
            }
        }

        function triggerManualRefresh() {
            const btn = document.querySelector('.refresh-btn');
            btn.textContent = "⏳ 更新中...";
            fetchWeather();
            if (isSystemReady) {
                fetchAndRenderETA();
            } else {
                initStopDatabase();
            }
            setTimeout(() => { btn.textContent = "🔄 刷新數據"; }, 1200);
        }

        function resetSystemCache() {
            localStorage.clear();
            location.reload();
        }

        function pixelShift() {
            const shifter = document.getElementById('pixel-shifter');
            shifter.style.transform = `translate(${Math.floor(Math.random() * 3) - 1}px, ${Math.floor(Math.random() * 3) - 1}px)`;
        }

        // 啟動程序
        updateClock();
        fetchWeather();
        initStopDatabase();

        setInterval(updateClock, 1000);
        setInterval(fetchAndRenderETA, 30000); // 鎖定後每 30 秒自動刷新
        setInterval(fetchWeather, 300000);
        setInterval(pixelShift, 600000);
    </script>
</body>
</html>
