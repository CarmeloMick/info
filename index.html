<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Transit & Weather Command Center</title>
  <style>
    /* 1. 高級深色主題色彩規格 (對齊目標圖片) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #0b0f19; /* 極致深藍黑底色 */
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 1.5vh 1.5vw;
    }

    .dashboard-container {
      display: flex;
      flex-direction: column;
      height: 97vh;
      gap: 1.5vh;
    }

    /* 毛玻璃卡片基底 */
    .glass-card {
      background-color: #131c2e; /* 高級灰藍色面板 */
      border: 1px solid #22314d;
      border-radius: 16px;
      padding: 2vh 2vw;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* 區塊 C：頂部天氣面版 */
    .weather-card {
      display: flex;
      gap: 3vw;
      height: 22vh;
    }
    .weather-left {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid #22314d;
      padding-right: 2vw;
    }
    .date-time-string {
      font-size: 2vh;
      color: #94a3b8;
      margin-bottom: 0.5vh;
      font-variant-numeric: tabular-nums;
    }
    .location-title {
      font-size: 3vh;
      font-weight: bold;
      color: #38bdf8;
    }
    .temp-row {
      display: flex;
      align-items: center;
      gap: 1.5vw;
      margin-top: 0.5vh;
    }
    .big-temp {
      font-size: 6.8vh;
      font-weight: bold;
      line-height: 1;
    }
    .weather-sub-metrics {
      font-size: 1.9vh;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 0.3vh;
    }
    .weather-right-text {
      flex: 2;
      font-size: 1.9vh;
      color: #cbd5e1;
      line-height: 1.6;
      overflow-y: auto;
    }

    /* 區塊 D：特別交通消息組件 (完美還原截圖中央看板) */
    .traffic-news-card {
      height: 10vh;
      display: flex;
      align-items: center;
      gap: 1.5vw;
      background-color: #16223f;
      border: 1px solid #2e4374;
    }
    .traffic-icon { font-size: 3.5vh; }
    .traffic-content-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .traffic-title {
      font-size: 2vh;
      font-weight: bold;
      color: #f43f5e; 
      margin-bottom: 0.2vh;
    }
    .traffic-text-container {
      font-size: 1.8vh;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 區塊 B：實時巴士看板分區 */
    .transit-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5vh;
      min-height: 0;
    }
    
    /* 高級導航 Pills Tabs */
    .tab-navigation {
      display: flex;
      gap: 1vw;
      border-bottom: 1px solid #22314d;
      padding-bottom: 1.2vh;
    }
    .tab-pill {
      background-color: #1e293b;
      color: #94a3b8;
      border: none;
      padding: 1vh 2vw;
      font-size: 2vh;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-pill.active {
      background-color: #2563eb; 
      color: #ffffff;
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
    }

    /* 巴士數據網格 */
    .bus-grid-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.6vh;
      overflow-y: auto;
      min-height: 0;
    }
    .bus-data-row {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 1.4vh 2vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .bus-info-meta { display: flex; flex-direction: column; }
    .route-badge-number {
      font-size: 4.2vh;
      font-weight: 900;
      color: #eab308; 
      line-height: 1;
    }
    .route-destination-text {
      font-size: 1.8vh;
      color: #64748b;
      margin-top: 0.5vh;
    }
    .arrival-slots-wrapper { display: flex; gap: 4vw; }
    .eta-slot-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      min-width: 10vw;
    }
    .eta-countdown-display {
      font-size: 3.6vh;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }
    .eta-countdown-display.incoming { color: #22c55e; }
    .eta-countdown-display.error-log { color: #f43f5e; font-size: 2vh; font-weight: normal; }
    .eta-absolute-clock-time {
      font-size: 1.7vh;
      color: #64748b;
      margin-top: 0.2vh;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <header class="glass-card weather-card">
      <div class="weather-left">
        <div id="live-clock-string" class="date-time-string">--月--日 (-) 00:00:00</div>
        <div class="location-title" id="location-name-display">沙田區</div>
        <div class="temp-row">
          <div id="weather-temp-text" class="big-temp">--°C</div>
          <div class="weather-sub-metrics">
            <span id="weather-humidity-text">相對濕度：--%</span>
            <span id="weather-warning-badges" style="color:#ef4444; font-weight:bold;"></span>
          </div>
        </div>
      </div>
      <div id="weather-report-summary" class="weather-right-text">
        正在啟動現代化 ES6+ 全動態數據流聯網引擎...
      </div>
    </header>

    <section class="glass-card traffic-news-card">
      <div class="traffic-icon">🚨</div>
      <div class="traffic-content-box">
        <div class="traffic-title">特別交通消息</div>
        <div id="traffic-news-container-text" class="traffic-text-container">現時交通大致正常。</div>
      </div>
    </section>

    <section class="glass-card transit-card">
      <div class="tab-navigation">
        <button class="tab-pill active" onclick="switchActiveTab('REGAL_NORTH')">富豪花園 (北行)</button>
        <button class="tab-pill" onclick="switchActiveTab('REGAL_SOUTH')">富豪花園 (南行)</button>
        <button class="tab-pill" onclick="switchActiveTab('TOWN_CENTER')">沙田市中心</button>
      </div>
      <div id="active-bus-rows-container" class="bus-grid-container"></div>
    </section>

  </div>

  <script>
    // 1. 本案監控的目標線路核心矩陣
    const DASHBOARD_MATRIX = {
      pollingIntervalMs: 30000, 
      tabs: {
        REGAL_NORTH: {
          searchName: "富豪花園",
          routes: [
            { route: "86K",  label: "往 沙田站" },
            { route: "89X",  label: "往 沙田站" },
            { route: "299X", label: "往 沙田市中心" },
            { route: "83K",  label: "往 沙田市中心 (循環線)" }
          ]
        },
        REGAL_SOUTH: {
          searchName: "富豪花園",
          routes: [
            { route: "284",  label: "往 濱景花園 (循環線)" },
            { route: "49X",  label: "往 青衣碼頭" }
          ]
        },
        TOWN_CENTER: {
          searchName: "沙田市中心總站",
          routes: [
            { route: "269D", label: "往 天富" }
          ]
        }
      }
    };

    let currentTabKey = "REGAL_NORTH";
    let globalResolvedStopIds = []; // 儲存動態掃描出的最新生功率 HASH
    let globalCachedEtaStore = {}; 

    const DOM = {
      clock: document.getElementById('live-clock-string'),
      location: document.getElementById('location-name-display'),
      temp: document.getElementById('weather-temp-text'),
      humidity: document.getElementById('weather-humidity-text'),
      warnings: document.getElementById('weather-warning-badges'),
      weatherSummary: document.getElementById('weather-report-summary'),
      trafficText: document.getElementById('traffic-news-container-text'),
      busContainer: document.getElementById('active-bus-rows-container')
    };

    // 實時秒針時鐘
    function runLiveClock() {
      const now = new Date();
      const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
      DOM.clock.textContent = `${now.getMonth() + 1}月${now.getDate()}日 (${weekdays[now.getDay()]}) ${now.toLocaleTimeString('zh-HK', { hour12: false })}`;
    }

    function switchActiveTab(tabKey) {
      currentTabKey = tabKey;
      document.querySelectorAll('.tab-pill').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(tabKey));
      });
      renderActiveTabUI();
    }

    // 繪製 UI 列
    function renderActiveTabUI() {
      DOM.busContainer.innerHTML = '';
      const tabConfig = DASHBOARD_MATRIX.tabs[currentTabKey];
      const now = new Date();

      tabConfig.routes.forEach((r, idx) => {
        const row = document.createElement('div');
        row.className = 'bus-data-row';
        const routeData = globalCachedEtaStore[r.route];

        let slotHtml = '';

        // 【除錯診斷】如果該線路有明確回傳錯誤訊息，直接印在畫面上，不吞任何 Error
        if (routeData && routeData.error) {
          slotHtml = `<div class="eta-slot-item" style="min-width: 25vw;">
                        <div class="eta-countdown-display error-log">聯網異常: ${routeData.error}</div>
                      </div>`;
        } else {
          const routeEtas = routeData || [];
          for (let seq = 0; seq < 2; seq++) {
            if (routeEtas[seq]) {
              const data = routeEtas[seq];
              const targetTime = new Date(data.eta);
              const diffMins = Math.max(0, Math.floor((targetTime - now) / 60000));
              
              const absHour = String(targetTime.getHours()).padStart(2, '0');
              const absMin = String(targetTime.getMinutes()).padStart(2, '0');
              
              const isIncoming = diffMins === 0;
              slotHtml += `
                <div class="eta-slot-item">
                  <div class="eta-countdown-display ${isIncoming ? 'incoming' : ''}">${isIncoming ? '即將抵達' : `${diffMins} 分鐘`}</div>
                  <div class="eta-absolute-clock-time">${absHour}:${absMin} ${data.rmk_tc || ''}</div>
                </div>`;
            } else {
              slotHtml += `
                <div class="eta-slot-item">
                  <div class="eta-countdown-display">${seq === 0 ? '暫無班次' : '--'}</div>
                  <div class="eta-absolute-clock-time"></div>
                </div>`;
            }
          }
        }

        row.innerHTML = `
          <div class="bus-info-meta">
            <div class="route-badge-number">${r.route}</div>
            <div class="route-destination-text">${r.label}</div>
          </div>
          <div class="arrival-slots-wrapper">${slotHtml}</div>`;
        DOM.busContainer.appendChild(row);
      });
    }

    /**
     * 【電腦 Chrome 專用】全自動名冊對號入座掃描器
     * 幾百毫秒內動態撈取最新官方 Master CDN，徹底根除 ID 過期死結
     */
    async function dynamicallyScanValidStopIds() {
      DOM.weatherSummary.textContent = "正在向九巴官方大數據庫下載並同步最新站點清單...";
      try {
        const res = await fetch('https://data.etabus.kmb.hk/v1/transport/kmb/stop');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        const allStops = json.data || [];

        // 提取我們要監控的目標車站中文名
        const targetNames = Object.keys(DASHBOARD_MATRIX.tabs).map(k => DASHBOARD_MATRIX.tabs[k].searchName);
        
        // 自動過濾出當下最新、生效中嘅所有 16 位元加密 HASH ID
        const matchedIds = allStops
          .filter(s => targetNames.includes(s.name_tc))
          .map(s => s.stop);

        globalResolvedStopIds = [...new Set(matchedIds)];
        return true;
      } catch (err) {
        console.error("Master Map Setup Error:", err);
        DOM.weatherSummary.innerHTML = `<span style="color:#f43f5e;font-weight:bold;">名冊同步失敗: ${err.message}。請按 F12 打開 Console 檢查。</span>`;
        return false;
      }
    }

    /**
     * 核心：多重 HASH 高頻併發直連獲取實時預報
     */
    async function executeConcurrentTransitPoll() {
      if (globalResolvedStopIds.length === 0) return;

      // 利用 Promise.all 同時發起請求，電腦 Chrome 執行速度極快
      const promises = globalResolvedStopIds.map(async (sid) => {
        try {
          const res = await fetch(`https://data.etabus.kmb.hk/v1/transport/kmb/stop-eta/${sid}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          return { data: json.data || [], error: null };
        } catch (e) {
          return { data: [], error: e.message };
        }
      });

      const results = await Promise.all(promises);
      
      // 將撈回的大雜燴數據包展平
      const megaMergedList = [];
      let networkErrorMsg = null;
      
      results.forEach(resObj => {
        if (resObj.error) networkErrorMsg = resObj.error;
        resObj.data.forEach(item => megaMergedList.push(item));
      });

      // 重新洗牌，對號入座分配給各路線
      Object.keys(DASHBOARD_MATRIX.tabs).forEach(k => {
        DASHBOARD_MATRIX.tabs[k].routes.forEach(userRoute => {
          
          if (networkErrorMsg && megaMergedList.length === 0) {
            // 如果網絡徹底斷連，標記錯誤訊息
            globalCachedEtaStore[userRoute.route] = { error: networkErrorMsg };
            return;
          }

          const matchedRawEtas = megaMergedList.filter(item => item.route === userRoute.route && item.eta);
          
          // 前端時間去重
          const uniqueEtas = [];
          const seenTimes = new Set();
          matchedRawEtas.forEach(item => {
            if (!seenTimes.has(item.eta)) {
              seenTimes.add(item.eta);
              uniqueEtas.push(item);
            }
          });

          // 依到站時間由近至遠排序
          uniqueEtas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
          globalCachedEtaStore[userRoute.route] = uniqueEtas;
        });
      });

      renderActiveTabUI();
    }

    // 香港天文台與特別交通消息對接
    async function fetchLiveNewsAndWeather() {
      const cacheBust = Date.now();
      
      try {
        const res = await fetch(`https://api.data.gov.hk/v1/transport/hk/tss/special-traffic-news?lang=tc&_=${cacheBust}`);
        if (res.ok) {
          const json = await res.json();
          DOM.trafficText.textContent = (json && json.length > 0) ? json[0].msgText : "現時交通大致正常。";
        }
      } catch (e) {}

      try {
        const wRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_=${cacheBust}`);
        if (wRes.ok) {
          const wData = await wRes.json();
          
          if (wData?.temperature?.data?.length > 0) {
            const shatinTemp = wData.temperature.data.find(d => d.place === "沙田");
            DOM.temp.textContent = shatinTemp ? `${shatinTemp.value}°C` : `${wData.temperature.data[0].value}°C`;
            DOM.location.textContent = shatinTemp ? "沙田區" : "香港";
          }
          if (wData?.humidity?.data?.length > 0) {
            DOM.humidity.textContent = `相對濕度：${wData.humidity.data[0].value}%`;
          }
          if (wData?.generalSituation) {
            DOM.weatherSummary.innerHTML = `<strong>【今日天氣概況】</strong>${wData.generalSituation}`;
          }
        }

        const warnRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc&_=${cacheBust}`);
        if (warnRes.ok) {
          const warnData = await warnRes.json();
          const keys = Object.keys(warnData);
          DOM.warnings.textContent = keys.length > 0 ? ` ⚠️ 生效警告: ${keys.map(k => warnData[k].name).join(', ')}` : "";
        }
      } catch (e) {}
    }

    // 啟動引導控制
    async function startEngine() {
      setInterval(runLiveClock, 1000);
      runLiveClock();

      renderActiveTabUI();

      // 第一步：掃描名冊提取當前最新生效 HASH
      const setupSuccess = await dynamicallyScanValidStopIds();
      if (!setupSuccess) return;

      // 第二步：執行定時刷新管道
      async function triggerPipeline() {
        await Promise.all([executeConcurrentTransitPoll(), fetchLiveNewsAndWeather()]);
      }
      
      setInterval(triggerPipeline, DASHBOARD_MATRIX.pollingIntervalMs);
      triggerPipeline();
    }

    document.addEventListener('DOMContentLoaded', startEngine);
  </script>
</body>
</html>
