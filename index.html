<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All-in-One Transit & Weather Command Center</title>
  <style>
    /* 全局高級深色主題色彩規格 (完美對齊目標截圖黑底質感) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #0b0f19; /* 極致深藍黑底色 */
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 1.5vh 1.5vw;
    }

    .dashboard-container {
      display: flex;
      flex-direction: column;
      height: 97vh;
      gap: 1.5vh;
    }

    /* 高級灰藍色面板卡片基底 */
    .glass-card {
      background-color: #131c2e; 
      border: 1px solid #22314d;
      border-radius: 16px;
      padding: 2vh 2vw;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* 區塊一：頂部天氣面版 */
    .weather-card {
      display: flex;
      gap: 3vw;
      height: 20vh;
    }
    .weather-left {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid #22314d;
      padding-right: 2vw;
    }
    .date-time-string {
      font-size: 2vh;
      color: #94a3b8;
      margin-bottom: 0.5vh;
      font-variant-numeric: tabular-nums;
    }
    .location-title {
      font-size: 3vh;
      font-weight: bold;
      color: #38bdf8;
    }
    .temp-row {
      display: flex;
      align-items: center;
      gap: 1.5vw;
      margin-top: 0.5vh;
    }
    .big-temp {
      font-size: 6.5vh;
      font-weight: bold;
      line-height: 1;
    }
    .weather-sub-metrics {
      font-size: 1.8vh;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 0.3vh;
    }
    .weather-right-text {
      flex: 2;
      font-size: 1.9vh;
      color: #cbd5e1;
      line-height: 1.6;
      overflow-y: auto;
    }

    /* 區塊二：特別交通消息組件 */
    .traffic-news-card {
      height: 9vh;
      display: flex;
      align-items: center;
      gap: 1.5vw;
      background-color: #16223f;
      border: 1px solid #2e4374;
    }
    .traffic-icon { font-size: 3.5vh; }
    .traffic-content-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .traffic-title {
      font-size: 2vh;
      font-weight: bold;
      color: #f43f5e; 
      margin-bottom: 0.2vh;
    }
    .traffic-text-container {
      font-size: 1.8vh;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 區塊三：實時智慧巴士看板 */
    .transit-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* 高級雙列 Grid 矩陣排版 (全部 7 條路線同屏並排展開，絕不分頁) */
    .bus-grid-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 完美平分左右兩列 */
      gap: 1.2vh 1.5vw;
      overflow-y: auto;
      min-height: 0;
      padding-right: 0.5vw;
    }

    .bus-data-row {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 1.5vh 2vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 11vh; /* 固定卡片高度 */
    }
    .bus-info-meta { display: flex; flex-direction: column; }
    .route-badge-number {
      font-size: 4.5vh;
      font-weight: 900;
      color: #eab308; 
      line-height: 1;
    }
    .route-destination-text {
      font-size: 1.8vh;
      color: #64748b;
      margin-top: 0.4vh;
    }
    .arrival-slots-wrapper { display: flex; gap: 3vw; }
    .eta-slot-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      min-width: 8vw;
    }
    .eta-countdown-display {
      font-size: 3.4vh;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }
    .eta-countdown-display.incoming { color: #22c55e; }
    .eta-countdown-display.no-service { color: #475569; font-size: 2vh; font-weight: normal; }
    .eta-absolute-clock-time {
      font-size: 1.7vh;
      color: #64748b;
      margin-top: 0.2vh;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <!-- 區塊一：天氣連線卡片 -->
    <header class="glass-card weather-card">
      <div class="weather-left">
        <div id="live-clock-string" class="date-time-string">--月--日 (-) 00:00:00</div>
        <div class="location-title" id="location-name-display">沙田區</div>
        <div class="temp-row">
          <div id="weather-temp-text" class="big-temp">--°C</div>
          <div class="weather-sub-metrics">
            <span id="weather-humidity-text">相對濕度：--%</span>
            <span id="weather-warning-badges" style="color:#ef4444; font-weight:bold;"></span>
          </div>
        </div>
      </div>
      <div id="weather-report-summary" class="weather-right-text">
        正在通過政府安全授權管道初始化巴士動態矩陣...
      </div>
    </header>

    <!-- 區塊二：特別交通消息 -->
    <section class="glass-card traffic-news-card">
      <div class="traffic-icon">🚨</div>
      <div class="traffic-content-box">
        <div class="traffic-title">特別交通消息</div>
        <div id="traffic-news-container-text" class="traffic-text-container">現時交通大致正常。</div>
      </div>
    </section>

    <!-- 區塊三：全線同屏合體看板 -->
    <section class="glass-card transit-card">
      <div id="active-bus-rows-container" class="bus-grid-container">
        <!-- 7 條線路會在此處並排生成 -->
      </div>
    </section>

  </div>

  <script>
    // 1. 嚴格對齊手機 App 截圖的 7 條路線以及精確的目的地過濾詞
    const MONITOR_ROUTES_LIST = [
      { route: "86K",  label: "往 沙田站",       destFilter: "沙田" },
      { route: "89X",  label: "往 沙田站",       destFilter: "沙田" },
      { route: "299X", label: "往 沙田市中心",   destFilter: "沙田" },
      { route: "83K",  label: "往 沙田市中心(循環線)", destFilter: "沙田" },
      { route: "284",  label: "往 濱景花園(循環線)",   destFilter: "濱景" },
      { route: "49X",  label: "往 青衣碼頭",     destFilter: "青衣" },
      { route: "269D", label: "往 天富",         destFilter: "天富" }
    ];

    const CACHE_KEY_STOPS = "DASHBOARD_LIVE_STOPS_V8";
    let globalResolvedStopIds = []; // 儲存動態篩選出嘅精確柱位 ID
    let globalCachedEtaStore = {}; 

    const DOM = {
      clock: document.getElementById('live-clock-string'),
      location: document.getElementById('location-name-display'),
      temp: document.getElementById('weather-temp-text'),
      humidity: document.getElementById('weather-humidity-text'),
      warnings: document.getElementById('weather-warning-badges'),
      weatherSummary: document.getElementById('weather-report-summary'),
      trafficText: document.getElementById('traffic-news-container-text'),
      busContainer: document.getElementById('active-bus-rows-container')
    };

    function runLiveClock() {
      const now = new Date();
      const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
      DOM.clock.textContent = `${now.getMonth() + 1}月${now.getDate()}日 (${weekdays[now.getDay()]}) ${now.toLocaleTimeString('zh-HK', { hour12: false })}`;
    }

    function renderGlobalDashboardUI() {
      DOM.busContainer.innerHTML = '';
      const now = new Date();

      MONITOR_ROUTES_LIST.forEach((r) => {
        const row = document.createElement('div');
        row.className = 'bus-data-row';
        const routeEtas = globalCachedEtaStore[r.route] || [];

        let slotHtml = '';
        for (let seq = 0; seq < 2; seq++) {
          if (routeEtas[seq]) {
            const data = routeEtas[seq];
            const targetTime = new Date(data.eta);
            const diffMins = Math.floor((targetTime - now) / 60000);
            
            const absHour = String(targetTime.getHours()).padStart(2, '0');
            const absMin = String(targetTime.getMinutes()).padStart(2, '0');
            
            const isIncoming = diffMins <= 0;
            const timeStr = isIncoming ? "即將抵達" : `${diffMins} 分鐘`;
            
            slotHtml += `
              <div class="eta-slot-item">
                <div class="eta-countdown-display ${isIncoming ? 'incoming' : ''}">${timeStr}</div>
                <div class="eta-absolute-clock-time">${absHour}:${absMin} ${data.rmk_tc || ''}</div>
              </div>`;
          } else {
            slotHtml += `
              <div class="eta-slot-item">
                <div class="eta-countdown-display no-service">${seq === 0 ? '暫無班次' : '--'}</div>
                <div class="eta-absolute-clock-time"></div>
              </div>`;
          }
        }

        row.innerHTML = `
          <div class="bus-info-meta">
            <div class="route-badge-number">${r.route}</div>
            <div class="route-destination-text">${r.label}</div>
          </div>
          <div class="arrival-slots-wrapper">${slotHtml}</div>`;
        DOM.busContainer.appendChild(row);
      });
    }

    /**
     * 【智慧解鎖：輕量化站點採集技術】
     * 完美避開 5MB 大檔案 CORS 封鎖！只下載 7 條路線專屬的 2KB 小名冊，全線綠色解鎖放行。
     */
    async function resolveTargetStopIds() {
      const cached = localStorage.getItem(CACHE_KEY_STOPS);
      if (cached) {
        try {
          globalResolvedStopIds = JSON.parse(cached);
          if (globalResolvedStopIds.length > 0) return true;
        } catch(e) { localStorage.removeItem(CACHE_KEY_STOPS); }
      }

      DOM.weatherSummary.textContent = "首次啟動：正在安全校對目標線路物理站點 (約需 2 秒)...";
      try {
        // 1. 收集這 7 條路線在上下行名冊中的所有站點 ID
        let rawCandidateIds = [];
        const bounds = ["outbound", "inbound"];
        
        for (const r of MONITOR_ROUTES_LIST) {
          for (const b of bounds) {
            try {
              const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${r.route}/${b}/1`);
              if (res.ok) {
                const json = await res.json();
                (json.data || []).forEach(s => rawCandidateIds.push(s.stop));
              }
            } catch(e){}
          }
        }
        
        const uniqueCandidates = [...new Set(rawCandidateIds)];

        // 2. 併發下載這些特定站點的名稱詳情 (單個車站詳情 API 原生支援 CORS)
        const stopNamesMap = {};
        await Promise.all(uniqueCandidates.map(async (sid) => {
          try {
            const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${sid}`);
            if (res.ok) {
              const json = await res.json();
              if (json.data && json.data.name_tc) {
                stopNamesMap[sid] = json.data.name_tc;
              }
            }
          } catch(e){}
        }));

        // 3. 過濾出所有名字叫「富豪花園」或者包含「沙田市中心」的精確物理加密 ID
        const matchedIds = [];
        uniqueCandidates.forEach(sid => {
          const name = stopNamesMap[sid] || "";
          if (name === "富豪花園" || name.includes("沙田市中心")) {
            matchedIds.push(sid);
          }
        });

        globalResolvedStopIds = [...new Set(matchedIds)];
        
        if (globalResolvedStopIds.length === 0) throw new Error("No stops found");

        localStorage.setItem(CACHE_KEY_STOPS, JSON.stringify(globalResolvedStopIds));
        return true;
      } catch (err) {
        console.error("Harvesting failed:", err);
        DOM.weatherSummary.textContent = "系統初始化失敗，請重新整理網頁。";
        return false;
      }
    }

    /**
     * 【並發大數據管道 + dest_tc 目的地精準對號入座 + 走車秒級抹除】
     */
    async function executeConcurrentTransitPoll() {
      if (globalResolvedStopIds.length === 0) return;

      const now = new Date();

      // 同時向採集到嘅物理站點發送實時預報請求
      const promises = globalResolvedStopIds.map(async (sid) => {
        try {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${sid}`);
          if (res.ok) {
            const json = await res.json();
            return json.data || [];
          }
        } catch (e) {}
        return [];
      });

      const results = await Promise.all(promises);
      const megaMergedList = results.flat();

      globalCachedEtaStore = {};

      // 智能過濾分流：拋棄盲猜站位代碼，直接用「車號 + 目的地字眼」進行對號入座
      MONITOR_ROUTES_LIST.forEach(userRoute => {
        const filteredRaw = megaMergedList.filter(item => {
          if (item.route !== userRoute.route || !item.eta || !item.dest_tc) return false;
          
          // 精確比對目的地（例如 86K 目的地必須包含「沙田」）
          if (!item.dest_tc.includes(userRoute.destFilter)) return false;

          return true;
        });

        // 去重與走車退走機制
        const uniqueEtas = [];
        const seenTimes = new Set();

        filteredRaw.forEach(item => {
          if (!seenTimes.has(item.eta)) {
            const targetTime = new Date(item.eta);
            
            // 💡【秒級走車抹除】只要巴士預計到站時間早過當前時間，代表車已開走，立刻丟棄抹除！
            if (targetTime - now < 0) return;

            seenTimes.add(item.eta);
            uniqueEtas.push(item);
          }
        });

        // 依時間排序
        uniqueEtas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
        globalCachedEtaStore[userRoute.route] = uniqueEtas;
      });

      renderGlobalDashboardUI();
    }

    // 香港天文台大數據直連
    async function fetchLiveNewsAndWeather() {
      const cacheBust = Date.now();
      try {
        const res = await fetch(`https://api.data.gov.hk/v1/transport/hk/tss/special-traffic-news?lang=tc&_=${cacheBust}`);
        if (res.ok) {
          const json = await res.json();
          DOM.trafficText.textContent = (json && json.length > 0) ? json[0].msgText : "現時交通大致正常。";
        }
      } catch (e) {}

      try {
        const wRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_=${cacheBust}`);
        if (wRes.ok) {
          const wData = await wRes.json();
          if (wData?.temperature?.data?.length > 0) {
            const shatinTemp = wData.temperature.data.find(d => d.place === "沙田");
            DOM.temp.textContent = shatinTemp ? `${shatinTemp.value}°C` : `${wData.temperature.data[0].value}°C`;
          }
          if (wData?.humidity?.data?.length > 0) {
            DOM.humidity.textContent = `相對濕度：${wData.humidity.data[0].value}%`;
          }
          if (wData?.generalSituation) {
            DOM.weatherSummary.innerHTML = `<strong>【今日天氣概況】</strong>${wData.generalSituation}`;
          }
        }

        const warnRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc&_=${cacheBust}`);
        if (warnRes.ok) {
          const warnData = await warnRes.json();
          const keys = Object.keys(warnData);
          DOM.warnings.textContent = keys.length > 0 ? ` ⚠️ 生效警告: ${keys.map(k => warnData[k].name).join(', ')}` : "";
        }
      } catch (e) {}
    }

    async function startEngine() {
      setInterval(runLiveClock, 1000);
      runLiveClock();

      renderGlobalDashboardUI();

      // 第一步：動態採集路線物理 ID 避開 CORS 大名冊封鎖
      const setupSuccess = await resolveTargetStopIds();
      if (!setupSuccess) return;

      // 第二步：啟動定時輪詢
      async function triggerPipeline() {
        await Promise.all([executeConcurrentTransitPoll(), fetchLiveNewsAndWeather()]);
      }
      
      setInterval(triggerPipeline, 30000);
      triggerPipeline();
    }

    document.addEventListener('DOMContentLoaded', startEngine);
  </script>
</body>
</html>
