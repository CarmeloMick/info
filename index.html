<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>薯屋交通 Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 10px;
        }

        /* 頂部時間區 (紅底) */
        .section-time {
            background-color: #b30000;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 8px;
        }
        .date { font-size: 1.4rem; font-weight: bold; color: #ffcccc; letter-spacing: 2px; }
        .time { font-size: 3.2rem; font-weight: bold; font-family: monospace; margin: 2px 0; }
        .custom-text { font-size: 1.2rem; font-weight: bold; color: #ffcc00; letter-spacing: 1px; }
        .status-msg { font-size: 0.85rem; color: #ffcccc; margin-top: 2px; font-weight: normal; }

        /* 中部巴士區 */
        .section-bus {
            flex: 1;
            background-color: #111;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow-y: auto;
        }
        .bus-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #222;
        }
        .bus-row:last-child { border-bottom: none; }
        .bus-info { display: flex; align-items: center; flex: 1; min-width: 0; }
        .bus-no {
            background-color: #ffcc00;
            color: #000;
            font-weight: bold;
            font-size: 1.4rem;
            padding: 3px 8px;
            border-radius: 6px;
            margin-right: 12px;
            min-width: 70px;
            text-align: center;
        }
        .bus-details { display: flex; flex-direction: column; }
        .bus-dest { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .bus-stop { font-size: 0.85rem; color: #888; margin-top: 1px; }
        .bus-eta { font-size: 1.5rem; font-weight: bold; color: #00ffcc; font-family: monospace; text-align: right; margin-left: 10px; }

        /* 底部天氣區 + 刷新功能 */
        .section-weather {
            background-color: #0044cc;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .weather-left { display: flex; flex-direction: column; }
        .temp { font-size: 3rem; font-weight: bold; line-height: 1; }
        .weather-meta { font-size: 1rem; color: #b3d1ff; margin-top: 3px; }
        
        .weather-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
        .warning-box {
            background-color: #ff3333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 4px;
            display: inline-block;
        }
        .weather-text { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .refresh-btn {
            margin-top: 5px;
            background-color: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }
        .refresh-btn:active { background-color: rgba(255,255,255,0.4); }
    </style>
</head>
<body>

    <div class="section-time" id="pixel-shifter">
        <div class="date" id="date-str">----/--/-- ---</div>
        <div class="time" id="time-str">00:00 --</div>
        <div class="custom-text">薯屋交通</div>
        <div class="status-msg" id="bus-status-message">初始化系統中...</div>
    </div>

    <div class="section-bus">
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">89X</div><div class="bus-details"><div class="bus-dest">往 沙田站</div><div class="bus-stop">富豪花園</div></div></div>
            <div class="bus-eta" id="bus-89X">連線中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">86K</div><div class="bus-details"><div class="bus-dest">往 沙田站</div><div class="bus-stop">沙田第一城</div></div></div>
            <div class="bus-eta" id="bus-86K">連線中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">299X</div><div class="bus-details"><div class="bus-dest">往 沙田市中心</div><div class="bus-stop">富豪花園</div></div></div>
            <div class="bus-eta" id="bus-299X">連線中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">83K</div><div class="bus-details"><div class="bus-dest">往 沙田市中心</div><div class="bus-stop">富豪花園</div></div></div>
            <div class="bus-eta" id="bus-83K">連線中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">284</div><div class="bus-details"><div class="bus-dest">往 濱景花園</div><div class="bus-stop">富豪花園</div></div></div>
            <div class="bus-eta" id="bus-284">連線中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">49X</div><div class="bus-details"><div class="bus-dest">往 青衣碼頭</div><div class="bus-stop">富豪花園</div></div></div>
            <div class="bus-eta" id="bus-49X">連線中...</div>
        </div>
        <div class="bus-row">
            <div class="bus-info"><div class="bus-no">269D</div><div class="bus-details"><div class="bus-dest">往 天富</div><div class="bus-stop">沙田市中心總站</div></div></div>
            <div class="bus-eta" id="bus-269D">連線中...</div>
        </div>
    </div>

    <div class="section-weather">
        <div class="weather-left">
            <div class="temp" id="weather-temp">--°C</div>
            <div class="weather-meta" id="weather-humidity">濕度: --%</div>
            <div class="weather-meta" id="weather-uv">UV 指數: --</div>
        </div>
        <div class="weather-right">
            <div id="weather-warning"></div>
            <div class="weather-text" id="weather-desc">正在連線...</div>
            <button class="refresh-btn" onclick="triggerManualRefresh()">🔄 刷新數據</button>
        </div>
    </div>

    <script>
        // 針對舊款 iPad (iOS 12-15) 設計的相容性超時 fetch 函數
        async function fetchWithTimeout(url, options = {}, timeout = 8000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (error) {
                clearTimeout(id);
                throw error;
            }
        }

        // 多重公用 CORS 代理輪替機制，確保直連被封鎖時可自動切換
        const PROXIES = [
            {
                name: "CorsProxy.io",
                getUrl: (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                isDirect: true
            },
            {
                name: "AllOrigins",
                getUrl: (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
                isDirect: false
            },
            {
                name: "ThingProxy",
                getUrl: (url) => `https://thingproxy.freeboard.io/fetch/${url}`,
                isDirect: true
            }
        ];

        async function fetchBusData(targetUrl) {
            let lastError = null;
            for (let proxy of PROXIES) {
                try {
                    const proxyUrl = proxy.getUrl(targetUrl);
                    const res = await fetchWithTimeout(proxyUrl, {}, 7000); // 每個代理限時 7 秒
                    if (res.ok) {
                        const resData = await res.json();
                        if (proxy.isDirect) {
                            if (resData && resData.data) return resData;
                        } else {
                            if (resData && resData.contents) {
                                const parsed = JSON.parse(resData.contents);
                                if (parsed && parsed.data) return parsed;
                            }
                        }
                    }
                } catch (err) {
                    console.warn(`${proxy.name} 失敗，嘗試下一個...`, err);
                    lastError = err;
                }
            }
            throw lastError || new Error("所有代理連線失敗");
        }

        // 路線配置：改用 中文站名 + 目的地關鍵字 進行動態無痛配對
        const busConfig = [
            { route: "89X", stopName: "富豪花園", destKeyword: "沙田", id: "bus-89X" },
            { route: "86K", stopName: "沙田第一城", destKeyword: "沙田", id: "bus-86K" },
            { route: "299X", stopName: "富豪花園", destKeyword: "沙田", id: "bus-299X" },
            { route: "83K", stopName: "富豪花園", destKeyword: "沙田", id: "bus-83K" },
            { route: "284", stopName: "富豪花園", destKeyword: "濱景", id: "bus-284" },
            { route: "49X", stopName: "富豪花園", destKeyword: "青衣", id: "bus-49X" },
            { route: "269D", stopName: "沙田市中心", destKeyword: "天富", id: "bus-269D" }
        ];

        let stopMap = {};
        let isStopMapLoaded = false;

        // 初始化：動態下載全港九巴站點 Hash 字典表 (約 1MB，只需下載一次)
        async function initStopMap() {
            try {
                document.getElementById('bus-status-message').textContent = "⌛ 正在同步全港巴士站表...";
                const stopListUrl = "https://data.etabus.gov.hk/v1/transport/kmb/stop";
                const json = await fetchBusData(stopListUrl);
                
                if (json && json.data) {
                    json.data.forEach(item => {
                        stopMap[item.stop] = item.name_tc;
                    });
                    isStopMapLoaded = true;
                    document.getElementById('bus-status-message').textContent = "✅ 站表同步成功，開始獲取班次";
                    fetchAllBusETA();
                }
            } catch (error) {
                document.getElementById('bus-status-message').textContent = "⚠️ 站表載入失敗，5秒後重試...";
                setTimeout(initStopMap, 5000);
            }
        }

        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            
            let hours = now.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('date-str').textContent = `${year}/${month}/${date} ${days[now.getDay()]}`;
            document.getElementById('time-str').textContent = `${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;
        }

        async function fetchWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                
                let shatinTemp = data.temperature.data.find(item => item.place === '沙田');
                if(shatinTemp) document.getElementById('weather-temp').textContent = `${shatinTemp.value}°C`;
                
                if(data.humidity) document.getElementById('weather-humidity').textContent = `濕度: ${data.humidity.data[0].value}%`;
                if(data.uvindex && data.uvindex.data.length > 0) {
                    document.getElementById('weather-uv').textContent = `UV 指數: ${data.uvindex.data[0].value}`;
                } else {
                    document.getElementById('weather-uv').textContent = `UV 指UM: 0`;
                }
                
                const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await warnRes.json();
                const warnBox = document.getElementById('weather-warning');
                warnBox.innerHTML = '';
                
                if (Object.keys(warnData).length > 0) {
                    for (let key in warnData) {
                        warnBox.innerHTML += `<div class="warning-box">${warnData[key].name}</div> `;
                    }
                    document.getElementById('weather-desc').textContent = "請注意警告";
                } else {
                    document.getElementById('weather-desc').textContent = "天氣大致良好";
                }
            } catch (error) {
                document.getElementById('weather-desc').textContent = "天氣更新失敗";
            }
        }

        async function fetchAllBusETA() {
            if (!isStopMapLoaded) return;
            
            busConfig.forEach(async (config) => {
                try {
                    const targetUrl = `https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${config.route}/1`;
                    const json = await fetchBusData(targetUrl);
                    
                    // 利用站表字典，將 16 位 Hash 還原成中文站名，再結合目的地篩選
                    const etas = json.data.filter(item => {
                        const actualStopName = stopMap[item.stop];
                        const matchStop = actualStopName && actualStopName.includes(config.stopName);
                        const matchDest = item.dest_tc && item.dest_tc.includes(config.destKeyword);
                        return matchStop && matchDest && item.eta;
                    });
                    
                    if(etas.length > 0) {
                        etas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
                        const nextBus1 = calculateMinutes(etas[0].eta);
                        const nextBus2 = etas[1] ? calculateMinutes(etas[1].eta) : '--';
                        document.getElementById(config.id).textContent = nextBus2 !== '--' ? `${nextBus1} / ${nextBus2}` : `${nextBus1}`;
                    } else {
                        document.getElementById(config.id).textContent = "未有班次";
                    }
                } catch (error) {
                    document.getElementById(config.id).textContent = "連線超時";
                    console.error(error);
                }
            });
        }

        function calculateMinutes(etaTimeStr) {
            if (!etaTimeStr) return '--';
            const diffMins = Math.ceil((new Date(etaTimeStr) - new Date()) / 1000 / 60);
            return diffMins <= 0 ? "即將到站" : `${diffMins} 鐘`;
        }

        function triggerManualRefresh() {
            const btn = document.querySelector('.refresh-btn');
            btn.textContent = "⏳ 更新中...";
            fetchWeather();
            if(isStopMapLoaded) {
                fetchAllBusETA();
            } else {
                initStopMap();
            }
            setTimeout(() => { btn.textContent = "🔄 刷新數據"; }, 1200);
        }

        function pixelShift() {
            const shifter = document.getElementById('pixel-shifter');
            shifter.style.transform = `translate(${Math.floor(Math.random() * 3) - 1}px, ${Math.floor(Math.random() * 3) - 1}px)`;
        }

        // 啟動程序
        updateClock();
        fetchWeather();
        initStopMap(); // 先載入站表字典，成功後會自動觸發第一次 ETA 獲取

        setInterval(updateClock, 1000);
        setInterval(fetchAllBusETA, 30000); 
        setInterval(fetchWeather, 300000);
        setInterval(pixelShift, 600000);
    </script>
</body>
</html>
