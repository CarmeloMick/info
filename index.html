<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All-in-One Transit & Weather Command Center (Official Station Sync)</title>
  <style>
    /* 全局高級深色主題色彩規格 (完美對齊目標大屏圖片) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #0b0f19; /* 極致深藍黑底色 */
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 1.5vh 1.5vw;
    }

    .dashboard-container {
      display: flex;
      flex-direction: column;
      height: 97vh;
      gap: 1.5vh;
    }

    /* 高級灰藍色面板卡片基底 */
    .glass-card {
      background-color: #131c2e; 
      border: 1px solid #22314d;
      border-radius: 16px;
      padding: 2vh 2vw;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* 區塊一：頂部天氣面版 */
    .weather-card {
      display: flex;
      gap: 3vw;
      height: 22vh;
    }
    .weather-left {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid #22314d;
      padding-right: 2vw;
    }
    .date-time-string {
      font-size: 2vh;
      color: #94a3b8;
      margin-bottom: 0.5vh;
      font-variant-numeric: tabular-nums;
    }
    .location-title {
      font-size: 3vh;
      font-weight: bold;
      color: #38bdf8;
    }
    .temp-row {
      display: flex;
      align-items: center;
      gap: 1.5vw;
      margin-top: 0.5vh;
    }
    .big-temp {
      font-size: 6.8vh;
      font-weight: bold;
      line-height: 1;
    }
    .weather-sub-metrics {
      font-size: 1.9vh;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 0.3vh;
    }
    .weather-right-text {
      flex: 2;
      font-size: 1.9vh;
      color: #cbd5e1;
      line-height: 1.6;
      overflow-y: auto;
    }

    /* 區塊二：特別交通消息組件 */
    .traffic-news-card {
      height: 10vh;
      display: flex;
      align-items: center;
      gap: 1.5vw;
      background-color: #16223f;
      border: 1px solid #2e4374;
    }
    .traffic-icon { font-size: 3.5vh; }
    .traffic-content-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .traffic-title {
      font-size: 2vh;
      font-weight: bold;
      color: #f43f5e; 
      margin-bottom: 0.2vh;
    }
    .traffic-text-container {
      font-size: 1.8vh;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 區塊三：實時巴士看板分區 */
    .transit-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5vh;
      min-height: 0;
    }

    /* 高級雙列 Grid 矩陣排版 (所有路線合體同屏展開) */
    .bus-grid-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 完美平分左右兩列 */
      gap: 1.2vh 1.5vw;
      overflow-y: auto;
      min-height: 0;
      padding-right: 0.5vw;
    }

    .bus-data-row {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 1.5vh 2vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 10.5vh; /* 縮減卡片高度，確保 7 條線路同屏不滾動 */
    }
    .bus-info-meta { display: flex; flex-direction: column; }
    .route-badge-number {
      font-size: 4.2vh;
      font-weight: 900;
      color: #eab308; 
      line-height: 1;
    }
    .route-destination-text {
      font-size: 1.6vh;
      color: #64748b;
      margin-top: 0.4vh;
    }
    .arrival-slots-wrapper { display: flex; gap: 3vw; }
    .eta-slot-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      min-width: 8vw;
    }
    .eta-countdown-display {
      font-size: 3.2vh;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }
    .eta-countdown-display.incoming { color: #22c55e; }
    .eta-countdown-display.no-service { color: #475569; font-size: 2vh; font-weight: normal; }
    .eta-absolute-clock-time {
      font-size: 1.6vh;
      color: #64748b;
      margin-top: 0.2vh;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <header class="glass-card weather-card">
      <div class="weather-left">
        <div id="live-clock-string" class="date-time-string">--月--日 (-) 00:00:00</div>
        <div class="location-title" id="location-name-display">沙田區</div>
        <div class="temp-row">
          <div id="weather-temp-text" class="big-temp">--°C</div>
          <div class="weather-sub-metrics">
            <span id="weather-humidity-text">相對濕度：--%</span>
            <span id="weather-warning-badges" style="color:#ef4444; font-weight:bold;"></span>
          </div>
        </div>
      </div>
      <div id="weather-report-summary" class="weather-right-text">
        正在啟動智能物理站柱精確校對引擎...
      </div>
    </header>

    <section class="glass-card traffic-news-card">
      <div class="traffic-icon">🚨</div>
      <div class="traffic-content-box">
        <div class="traffic-title">特別交通消息</div>
        <div id="traffic-news-container-text" class="traffic-text-container">現時交通大致正常。</div>
      </div>
    </section>

    <section class="glass-card transit-card">
      <div id="active-bus-rows-container" class="bus-grid-container">
        </div>
    </section>

  </div>

  <script>
    // 1. 嚴格對齊手機 App 截圖的 7 條路線及其來源物理柱位分組
    const MONITOR_ROUTES_LIST = [
      { route: "86K",  label: "往 沙田站 (ST511)",   group: "ST511" },
      { route: "89X",  label: "往 沙田站 (ST511)",   group: "ST511" },
      { route: "299X", label: "往 沙田市中心 (ST511)", group: "ST511" },
      { route: "83K",  label: "往 沙田市中心 (ST511)", group: "ST511" },
      { route: "284",  label: "往 濱景花園 (ST511)",   group: "ST511" },
      { route: "49X",  label: "往 青衣碼頭 (ST512)",   group: "ST512" },
      { route: "269D", label: "往 天富 (ST912)",       group: "ST912" }
    ];

    const CACHE_KEY_STOPS = "DASHBOARD_STATION_PILLARS_V1";
    let globalStops = { st511: null, st512: null, st912: null };
    let globalCachedEtaStore = {}; 

    const DOM = {
      clock: document.getElementById('live-clock-string'),
      location: document.getElementById('location-name-display'),
      temp: document.getElementById('weather-temp-text'),
      humidity: document.getElementById('weather-humidity-text'),
      warnings: document.getElementById('weather-warning-badges'),
      weatherSummary: document.getElementById('weather-report-summary'),
      trafficText: document.getElementById('traffic-news-container-text'),
      busContainer: document.getElementById('active-bus-rows-container')
    };

    function runLiveClock() {
      const now = new Date();
      const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
      DOM.clock.textContent = `${now.getMonth() + 1}月${now.getDate()}日 (${weekdays[now.getDay()]}) ${now.toLocaleTimeString('zh-HK', { hour12: false })}`;
    }

    function renderGlobalDashboardUI() {
      DOM.busContainer.innerHTML = '';
      const now = new Date();

      MONITOR_ROUTES_LIST.forEach((r) => {
        const row = document.createElement('div');
        row.className = 'bus-data-row';
        const routeEtas = globalCachedEtaStore[r.route] || [];

        let slotHtml = '';
        for (let seq = 0; seq < 2; seq++) {
          if (routeEtas[seq]) {
            const data = routeEtas[seq];
            const targetTime = new Date(data.eta);
            const diffMins = Math.floor((targetTime - now) / 60000);
            
            const absHour = String(targetTime.getHours()).padStart(2, '0');
            const absMin = String(targetTime.getMinutes()).padStart(2, '0');
            
            const isIncoming = diffMins <= 0;
            const timeStr = isIncoming ? "即將抵達" : `${diffMins} 分鐘`;
            
            slotHtml += `
              <div class="eta-slot-item">
                <div class="eta-countdown-display ${isIncoming ? 'incoming' : ''}">${timeStr}</div>
                <div class="eta-absolute-clock-time">${absHour}:${absMin} ${data.rmk_tc || ''}</div>
              </div>`;
          } else {
            slotHtml += `
              <div class="eta-slot-item">
                <div class="eta-countdown-display no-service">${seq === 0 ? '暫無班次' : '--'}</div>
                <div class="eta-absolute-clock-time"></div>
              </div>`;
          }
        }

        row.innerHTML = `
          <div class="bus-info-meta">
            <div class="route-badge-number">${r.route}</div>
            <div class="route-destination-text">${r.label}</div>
          </div>
          <div class="arrival-slots-wrapper">${slotHtml}</div>`;
        DOM.busContainer.appendChild(row);
      });
    }

    /**
     * 【智慧柱位解碼引擎】
     * 透過路線名冊，動態反向推導出 ST511, ST512, ST912 精確的 16 位元加密政府 HASH ID
     */
    async function resolveExactStopIds() {
      const cached = localStorage.getItem(CACHE_KEY_STOPS);
      if (cached) {
        try {
          globalStops = JSON.parse(cached);
          if (globalStops.st511 && globalStops.st512 && globalStops.st912) return true;
        } catch(e) { localStorage.removeItem(CACHE_KEY_STOPS); }
      }

      DOM.weatherSummary.textContent = "首次啟動：正在精確鎖定截圖中的 ST511、ST512、ST912 物理巴士站柱...";
      try {
        // 1. 下載基礎名冊對照表
        const rStops = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
        const dStops = await rStops.json();
        const stopNameMap = new Map((dStops.data || []).map(s => [s.stop, s.name_tc]));

        // 2. 透過 86K Outbound 鎖定 ST511 (富豪花園北行站)
        const r86k = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/86K/outbound/1');
        const d86k = await r86k.json();
        let st511 = (d86k.data || []).map(s => s.stop).find(id => stopNameMap.get(id) === "富豪花園");
        
        if (!st511) { // 防禦性雙向容錯
          const r86kIn = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/86K/inbound/1');
          const d86kIn = await r86kIn.json();
          st511 = (d86kIn.data || []).map(s => s.stop).find(id => stopNameMap.get(id) === "富豪花園");
        }

        // 3. 透過 49X Outbound 鎖定 ST512 (富豪花園南行站 - 往青衣方向)
        const r49x = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/49X/outbound/1');
        const d49x = await r49x.json();
        let st512 = (d49x.data || []).map(s => s.stop).find(id => stopNameMap.get(id) === "富豪花園" && id !== st511);

        if (!st512) {
          const r49xIn = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/49X/inbound/1');
          const d49xIn = await r49xIn.json();
          st512 = (d49xIn.data || []).map(s => s.stop).find(id => stopNameMap.get(id) === "富豪花園" && id !== st511);
        }

        // 4. 透過 269D Outbound 鎖定 ST912 (沙田市中心總站坑位)
        const r269d = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/269D/outbound/1');
        const d269d = await r269d.json();
        let st912 = (d269d.data || []).map(s => s.stop).find(id => {
          const name = stopNameMap.get(id) || "";
          return name.includes("沙田市中心");
        });

        if (!st912) {
          const r269dIn = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/269D/inbound/1');
          const d269dIn = await r269dIn.json();
          st912 = (d269dIn.data || []).map(s => s.stop).find(id => {
            const name = stopNameMap.get(id) || "";
            return name.includes("沙田市中心");
          });
        }

        if (st511 && st512 && st912) {
          globalStops = { st511, st512, st912 };
          localStorage.setItem(CACHE_KEY_STOPS, JSON.stringify(globalStops));
          return true;
        }
        throw new Error("Pillar missing");
      } catch (err) {
        console.error("Resolution failed:", err);
        DOM.weatherSummary.innerHTML = `<span style="color:#f43f5e;font-weight:bold;">站柱定位失敗，正在自動重試...</span>`;
        return false;
      }
    }

    /**
     * 【精確柱位三管直連管道 + 走車秒級無痕退走】
     */
    async function executeConcurrentTransitPoll() {
      if (!globalStops.st511 || !globalStops.st512 || !globalStops.st912) return;

      const now = new Date();

      // 唯獨精確直連這三個截圖指定的物理亭位，絕不交叉污染
      const [res511, res512, res912] = await Promise.all([
        fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${globalStops.st511}`).then(r => r.json()).catch(() => ({data:[]})),
        fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${globalStops.st512}`).then(r => r.json()).catch(() => ({data:[]})),
        fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${globalStops.st912}`).then(r => r.json()).catch(() => ({data:[]}))
      ]);

      const data511 = res511.data || [];
      const data512 = res512.data || [];
      const data912 = res912.data || [];

      globalCachedEtaStore = {};

      MONITOR_ROUTES_LIST.forEach(userRoute => {
        let sourceData = [];
        if (userRoute.group === "ST511") sourceData = data511;
        else if (userRoute.group === "ST512") sourceData = data512;
        else if (userRoute.group === "ST912") sourceData = data912;

        const matchedRawEtas = sourceData.filter(item => item.route === userRoute.route && item.eta);
        
        const uniqueEtas = [];
        const seenTimes = new Set();
        
        matchedRawEtas.forEach(item => {
          if (!seenTimes.has(item.eta)) {
            const targetTime = new Date(item.eta);
            
            // 💡【秒級走車退走機制】
            // 如果巴士到站時間已經過去超過 30 秒（例如已經開走 1 分鐘但官方 cache 未清），
            // 前端直接將其抹除退走，保證畫面極速更新！
            if (targetTime - now < -30000) return;

            seenTimes.add(item.eta);
            uniqueEtas.push(item);
          }
        });

        uniqueEtas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
        globalCachedEtaStore[userRoute.route] = uniqueEtas;
      });

      renderGlobalDashboardUI();
    }

    async function fetchLiveNewsAndWeather() {
      const cacheBust = Date.now();
      try {
        const res = await fetch(`https://api.data.gov.hk/v1/transport/hk/tss/special-traffic-news?lang=tc&_=${cacheBust}`);
        if (res.ok) {
          const json = await res.json();
          DOM.trafficText.textContent = (json && json.length > 0) ? json[0].msgText : "現時交通大致正常。";
        }
      } catch (e) {}

      try {
        const wRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_=${cacheBust}`);
        if (wRes.ok) {
          const wData = await wRes.json();
          if (wData?.temperature?.data?.length > 0) {
            const shatinTemp = wData.temperature.data.find(d => d.place === "沙田");
            DOM.temp.textContent = shatinTemp ? `${shatinTemp.value}°C` : `${wData.temperature.data[0].value}°C`;
          }
          if (wData?.humidity?.data?.length > 0) {
            DOM.humidity.textContent = `相對濕度：${wData.humidity.data[0].value}%`;
          }
          if (wData?.generalSituation) {
            DOM.weatherSummary.innerHTML = `<strong>【今日天氣概況】</strong>${wData.generalSituation}`;
          }
        }

        const warnRes = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc&_=${cacheBust}`);
        if (warnRes.ok) {
          const warnData = await warnRes.json();
          const keys = Object.keys(warnData);
          DOM.warnings.textContent = keys.length > 0 ? ` ⚠️ 生效警告: ${keys.map(k => warnData[k].name).join(', ')}` : "";
        }
      } catch (e) {}
    }

    async function startEngine() {
      setInterval(runLiveClock, 1000);
      runLiveClock();

      renderGlobalDashboardUI();

      const setupSuccess = await resolveExactStopIds();
      if (!setupSuccess) {
        setTimeout(startEngine, 2000); // 失敗則兩秒後重試
        return;
      }

      async function triggerPipeline() {
        await Promise.all([executeConcurrentTransitPoll(), fetchLiveNewsAndWeather()]);
      }
      
      setInterval(triggerPipeline, 30000);
      triggerPipeline();
    }

    document.addEventListener('DOMContentLoaded', startEngine);
  </script>
</body>
</html>
